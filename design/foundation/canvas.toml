title = "Foundation"

# Sola's design as built (branch `next`, 2026-10-24): the official sheet.
# Tokens from ../tokens.css; parts and the board chrome in foundation.css /
# foundation.js, so every board draws the same desk. Printed token values
# are read live from the CSS, so they follow tokens.css. Boards stack top
# to bottom; the desk board is 2064 wide (canto's 1920 at 1:1).

