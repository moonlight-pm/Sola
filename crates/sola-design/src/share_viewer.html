<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Design</title>
<style>
  :root { --bg: #141518; --fg: #c9ccd2; --muted: #7d828c; --line: #2b2e34; --chip: #1d1f23; --accent: #7aa7ff; --note: #e3b341; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  #plane { position: absolute; inset: 0; touch-action: none; }
  body.panning, body.panning * { cursor: grabbing !important; user-select: none; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .board { position: absolute; }
  .board iframe { display: block; border: 0; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.35); }
  /* As in Design: 12px at any zoom, 6px above the board, cut at its width. */
  .board .title { position: absolute; left: 0; bottom: 100%; padding-bottom: 6px; font-size: 12px; line-height: 16px;
    white-space: nowrap; overflow: hidden; color: var(--muted); transform-origin: 0 100%; pointer-events: none; }
  body.panning .board iframe { pointer-events: none; }
  #head { position: fixed; top: 14px; left: 16px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  #head .name { font-weight: 600; }
  #live { width: 7px; height: 7px; border-radius: 50%; background: #4bbf73; box-shadow: 0 0 0 3px rgba(75,191,115,.15); }
  #live.off { background: var(--muted); box-shadow: none; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; align-items: center;
    padding: 4px; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #bar button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 7px; color: var(--fg); }
  #bar button:hover { background: #26292e; }
  #pct { min-width: 48px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; color: var(--muted); }
  #help { position: fixed; left: 16px; bottom: 22px; color: var(--muted); font-size: 12px; pointer-events: none; }
  /* Annotations, as in Design: fixed sizes on screen, drawn over the plane. */
  #under, #over { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #ink { position: absolute; inset: 0; pointer-events: none; }
  .sec { position: absolute; transform: translateY(-100%); }
  .sec > div { display: inline-block; margin: 0 0 0 -6px; padding: 3px 6px; border-radius: 6px; background: rgba(20,21,24,.88); }
  .sec b { display: block; font-size: 15px; font-weight: 500; line-height: 20px; color: var(--fg); }
  .sec span { display: block; font-size: 12px; line-height: 16px; color: var(--muted); margin-top: 3px; }
  .lbl { position: absolute; transform: translate(-50%, -50%); padding: 2px 7px; border: 1px solid var(--accent);
    border-radius: 7px; background: var(--bg); font-size: 11px; line-height: 15px; white-space: nowrap; }
  .note { position: absolute; width: 0; height: 0; pointer-events: auto; }
  .note .dot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    background: var(--note); color: #1a1407; box-shadow: 0 0 0 1.5px var(--bg); font: 500 11px/18px system-ui, sans-serif;
    text-align: center; user-select: none; }
  .note .card { display: none; position: absolute; left: 14px; top: -12px; width: max-content; max-width: 280px;
    padding: 9px 11px; border: 1px solid rgba(227,179,65,.75); border-radius: 8px; background: var(--chip);
    font-size: 12px; line-height: 16px; white-space: pre-wrap; }
  .note.flip .card { left: auto; right: 14px; }
  .note.open .card, .note:hover .card { display: block; }
  .note:hover { z-index: 2; }
  .pop { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); display: none; padding: 6px 8px;
    background: var(--chip); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .pop button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 7px; color: var(--fg); }
  .pop button:hover { background: #26292e; }
  .pop button:disabled { opacity: .35; cursor: default; background: none; }
  #flows button { display: block; width: 300px; }
  #flows small, #tour small { display: block; color: var(--muted); font-size: 12px; }
  #tour .row { display: flex; gap: 4px; align-items: center; justify-content: center; }
  #tour .picks { flex-wrap: wrap; margin-bottom: 6px; }
  #tour .picks button { border: 1px solid var(--line); }
  #tour .where { padding: 0 6px; min-width: 120px; }
  #tour .where b { font-weight: 500; }
  #bar button.on { color: var(--accent); }
</style>
</head>
<body>
<div id="plane"><svg id="under"></svg><div id="world"></div><svg id="over"></svg><div id="ink"></div></div>
<div id="head"><span id="live" title="Live"></span><span class="name" id="name"></span></div>
<div id="bar">
  <button id="out" title="Zoom out (-)">−</button><span id="pct">100%</span><button id="in" title="Zoom in (+)">+</button>
  <button id="fit" title="Fit (0)">Fit</button>
  <button id="notes-btn" title="Show every note (N)" hidden>Notes</button>
  <button id="flows-btn" title="Walk a flow" hidden>Flows</button>
</div>
<div id="flows" class="pop"></div>
<div id="tour" class="pop"></div>
<div id="help"></div>
<div id="msg"></div>
<script>
(() => {
  const plane = document.getElementById('plane'), world = document.getElementById('world');
  const pct = document.getElementById('pct'), live = document.getElementById('live');
  let cam = { x: 48, y: 48, z: 1 }, moved = false, boards = new Map(), version = null, layoutKey = '';
  // canvas.toml annotations; what the pointer is over in a page; the tour.
  let annot = { sections: [], links: [], notes: [], flows: [] }, hover = null, tour = null, glide = null;
  let notesOpen = false, flowsOpen = false;
  const openNotes = new Set();

  const apply = () => {
    world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
    pct.textContent = Math.round(cam.z * 100) + '%';
    for (const b of boards.values()) {
      b.title.style.transform = `scale(${1 / cam.z})`;
      b.title.style.maxWidth = b.w * cam.z + 'px';
    }
    render();
  };
  const zoomAt = (px, py, f) => {
    glide = null;
    const z = Math.min(32, Math.max(0.05, cam.z * f));
    cam.x = px - (px - cam.x) * (z / cam.z); cam.y = py - (py - cam.y) * (z / cam.z); cam.z = z;
    moved = true; apply();
  };
  const fit = () => {
    if (!boards.size) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const b of boards.values()) {
      x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
      x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
    }
    // Room above for section titles, as in Design.
    const pad = 56, W = innerWidth, H = innerHeight, top = annot.sections.length ? 44 : 0;
    const z = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad - 40 - top) / (y1 - y0), 1);
    cam = { z, x: (W - (x1 - x0) * z) / 2 - x0 * z, y: (H - 40 - top - (y1 - y0) * z) / 2 - y0 * z + 20 + top };
    apply();
  };

  // Height of an `auto` board Design has not measured: its page's content
  // (Design's formula — not the viewport, which starts at 900), measured a
  // few times as fonts and images arrive. Design's own height wins.
  const measure = (b) => {
    if (!b.auto || b.measured) return;
    try {
      const doc = b.frame.contentDocument;
      const h = Math.ceil(Math.max(doc.body ? doc.body.scrollHeight : 0,
        doc.documentElement.getBoundingClientRect().height));
      if (h > 0 && h !== b.h) { b.h = h; b.frame.style.height = h + 'px'; if (!moved) fit(); }
    } catch (e) { /* not same-origin (a web src) */ }
  };

  // What a page declares (as Design reads it when a board settles): its
  // exits, its plain links that lead to another board, and the elements
  // notes are pinned to. Rects are board-local CSS px.
  const words = (s) => (s || '').trim().replace(/\s+/g, ' ').slice(0, 60);
  const pageKey = (u) => {
    try { const x = new URL(u, location.href); return { page: x.origin + x.pathname + x.search, hash: x.hash }; }
    catch (e) { return null; }
  };
  // As Design (marks.rs): a link to the board's own page goes nowhere unless
  // its fragment names another board's; one that fits several, nowhere.
  const boardFor = (href, from) => {
    const want = pageKey(href), own = boards.has(from) && boards.get(from).key;
    if (!want) return null;
    const hits = [...boards.values()].filter((b) => b.id !== from && b.key && b.key.page === want.page);
    const named = hits.filter((b) => b.key.hash === want.hash);
    const byHash = named.length === 1 ? named[0].id : null;
    if (own && own.page === want.page) return own.hash !== want.hash ? byHash : null;
    return hits.length === 1 ? hits[0].id : byHash;
  };
  const scan = (b) => {
    let doc;
    try { doc = b.frame.contentDocument; void doc.body; } catch (e) { return; }
    if (!doc || !doc.body) return;
    const box = (el) => { const r = el.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
    const seen = (r) => r.w > 0 && r.h > 0;
    b.exits = [...doc.querySelectorAll('[data-design-to]')].slice(0, 100).map((el) => ({
      el, to: el.getAttribute('data-design-to').trim(), label: (el.getAttribute('data-design-label') || '').trim(),
      text: words(el.innerText || el.getAttribute('aria-label')), r: box(el),
    })).filter((e) => e.to && e.to !== b.id && boards.has(e.to) && seen(e.r));
    b.links = [...doc.querySelectorAll('a[href]')].filter((a) => !a.closest('[data-design-to]')).slice(0, 300)
      .map((a) => ({ el: a, to: boardFor(a.href, b.id), r: box(a) })).filter((l) => l.to && seen(l.r));
    b.anchors = {};
    for (const n of annot.notes) {
      if (n.board !== b.id || !n.at) continue;
      let el = null;
      try { el = doc.querySelector(n.at); } catch (e) {}
      b.anchors[n.n] = el ? box(el) : null;
    }
    render();
  };

  // As in Design: pages are live (left button, hover, keys), the right
  // button drags the canvas anywhere — the pages never see it — and the
  // wheel always zooms. Touch: two fingers pan and pinch over a page, one
  // finger pans on the background.
  let pan = null;
  const startPan = (e) => { pan = { x: e.screenX, y: e.screenY }; document.body.classList.add('panning'); };
  const movePan = (e) => {
    if (!pan) return;
    glide = null;
    cam.x += e.screenX - pan.x; cam.y += e.screenY - pan.y; pan = { x: e.screenX, y: e.screenY };
    moved = true; apply();
  };
  const endPan = () => { pan = null; document.body.classList.remove('panning'); };
  // Pinch / two-finger pan from client points already in this window.
  let pinch = null;
  const gesture = (a, b) => {
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch) { cam.x += mx - pinch.mx; cam.y += my - pinch.my; zoomAt(mx, my, d / pinch.d); }
    pinch = { d, mx, my };
  };

  const hookPage = (b) => {
    let win;
    try { win = b.frame.contentWindow; void win.document; } catch (e) { return; } // web src
    const toHere = (x, y) => {
      const r = b.frame.getBoundingClientRect(), s = r.width / b.frame.clientWidth;
      return { x: r.left + x * s, y: r.top + y * s };
    };
    // No scrollbars (they would also take layout width).
    try {
      const style = win.document.createElement('style');
      style.textContent = 'html { scrollbar-width: none; } html::-webkit-scrollbar { display: none; }';
      win.document.head.append(style);
    } catch (e) {}
    const swallow = (e) => { e.preventDefault(); e.stopImmediatePropagation(); };
    const right = (e) => e.button === 2;
    win.addEventListener('pointerdown', (e) => { if (right(e)) swallow(e); }, true);
    win.addEventListener('pointerup', (e) => { if (right(e)) swallow(e); }, true);
    win.addEventListener('mousedown', (e) => { if (right(e)) { swallow(e); startPan(e); } }, true);
    win.addEventListener('mousemove', (e) => { if (pan) { e.stopImmediatePropagation(); movePan(e); } }, true);
    win.addEventListener('mouseup', (e) => { if (right(e) && pan) { swallow(e); endPan(); } }, true);
    win.addEventListener('contextmenu', swallow, true);
    // An exit, or a plain link to another board's page: the camera goes
    // there; the page does not get the click.
    const target = (el) => {
      if (!el) return null;
      const to = el.hasAttribute('data-design-to') ? el.getAttribute('data-design-to').trim() : boardFor(el.href, b.id);
      return to && to !== b.id && boards.has(to) ? to : null;
    };
    const hotEl = (e) => (e.target && e.target.closest ? e.target.closest('[data-design-to], a[href]') : null);
    win.addEventListener('click', (e) => {
      const to = e.button === 0 ? target(hotEl(e)) : null;
      if (!to) return;
      swallow(e);
      follow(b.id, to);
    }, true);
    win.addEventListener('mouseover', (e) => {
      const el = hotEl(e), to = target(el);
      const h = to ? { board: b.id, el } : null;
      if ((h && h.el) !== (hover && hover.el)) { hover = h; render(); }
    }, true);
    win.document.documentElement.addEventListener('mouseleave', () => { if (hover) { hover = null; render(); } });
    win.addEventListener('wheel', (e) => {
      e.preventDefault();
      const p = toHere(e.clientX, e.clientY);
      zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0015));
    }, { passive: false });
    const twoFingers = (e) => {
      if (e.touches.length !== 2) { pinch = null; return; }
      e.preventDefault();
      gesture(toHere(e.touches[0].clientX, e.touches[0].clientY), toHere(e.touches[1].clientX, e.touches[1].clientY));
    };
    win.addEventListener('touchstart', twoFingers, { passive: false, capture: true });
    win.addEventListener('touchmove', twoFingers, { passive: false, capture: true });
    win.addEventListener('touchend', () => { pinch = null; }, true);
  };

  const build = (data) => {
    document.getElementById('name').textContent = data.title || '';
    document.title = (data.title || 'Canvas') + ' — Design';
    const msg = document.getElementById('msg');
    msg.style.display = data.error ? 'grid' : 'none';
    msg.textContent = data.error || '';
    world.textContent = ''; boards.clear();
    annot = { sections: data.sections || [], links: data.links || [], notes: data.notes || [], flows: data.flows || [] };
    inkKey = null; hover = null;
    if (tour && !(tour.path = tour.path.filter((id) => data.artboards.some((a) => a.id === id))).length) tour = null;
    document.getElementById('notes-btn').hidden = !annot.notes.length;
    document.getElementById('flows-btn').hidden = !annot.flows.length;
    for (const a of data.artboards) {
      const el = document.createElement('div'); el.className = 'board';
      el.style.left = a.x + 'px'; el.style.top = a.y + 'px';
      const title = document.createElement('div'); title.className = 'title'; title.textContent = a.title;
      const frame = document.createElement('iframe');
      frame.src = a.src; frame.title = a.title;
      // As in Design: no scrollbars; content past the board is cut off.
      frame.setAttribute('scrolling', 'no');
      frame.style.width = a.width + 'px'; frame.style.height = a.height + 'px';
      el.append(title, frame); world.append(el);
      const b = { id: a.id, x: a.x, y: a.y, w: a.width, h: a.height, auto: a.auto, measured: a.measured, frame, title,
        key: pageKey(a.src), exits: [], links: [], anchors: {} };
      const settle = () => { measure(b); scan(b); };
      frame.addEventListener('load', () => {
        hookPage(b); settle();
        try { b.frame.contentDocument.fonts.ready.then(settle); } catch (e) {}
        for (const ms of [1000, 3000, 8000]) setTimeout(settle, ms);
      });
      boards.set(a.id, b);
    }
    if (!moved) fit(); else apply();
  };

  // ── Annotations (as in Design: crate routes.rs / annotate.rs) ──────
  const under = document.getElementById('under'), over = document.getElementById('over');
  const ink = document.getElementById('ink');
  const scr = (r) => ({ x: cam.x + r.x * cam.z, y: cam.y + r.y * cam.z, w: r.w * cam.z, h: r.h * cam.z });
  const boardRect = (b) => ({ x: b.x, y: b.y, w: b.w, h: b.h });
  const sectionBox = (rects) => {
    if (!rects.length) return null;
    const x0 = Math.min(...rects.map((r) => r.x)), y0 = Math.min(...rects.map((r) => r.y));
    const x1 = Math.max(...rects.map((r) => r.x + r.w)), y1 = Math.max(...rects.map((r) => r.y + r.h));
    const pad = Math.max(64 * cam.z, 12), top = pad + 24;
    return { x: x0 - pad, y: y0 - top, w: x1 - x0 + 2 * pad, h: y1 - y0 + pad + top };
  };
  const OUT = { L: [-1, 0], R: [1, 0], T: [0, -1], B: [0, 1] };
  const sides = (a, b) => {
    const gx = Math.max(b.x - (a.x + a.w), a.x - (b.x + b.w)), gy = Math.max(b.y - (a.y + a.h), a.y - (b.y + b.h));
    const dx = b.x + b.w / 2 - (a.x + a.w / 2), dy = b.y + b.h / 2 - (a.y + a.h / 2);
    const acrossX = gx > 0 || gy > 0 ? gx >= gy : Math.abs(dx) >= Math.abs(dy);
    if (acrossX) return dx >= 0 ? ['R', 'L'] : ['L', 'R'];
    return dy >= 0 ? ['B', 'T'] : ['T', 'B'];
  };
  const along = (r, s, k, n) => {
    const len = s === 'T' || s === 'B' ? r.w : r.h;
    const off = (k - (n - 1) / 2) * Math.min(len / (n + 1), 28), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    return s === 'L' ? [r.x, cy + off] : s === 'R' ? [r.x + r.w, cy + off] : s === 'T' ? [cx + off, r.y] : [cx + off, r.y + r.h];
  };
  const route = (arrows) => {
    const sd = arrows.map((a) => sides(a.from, a.to));
    const starts = arrows.map((a, i) => along(a.from, sd[i][0], 0, 1));
    return arrows.map((a, i) => {
      const side = sd[i][1], horiz = side === 'T' || side === 'B';
      const pos = (j) => (horiz ? starts[j][0] : starts[j][1]);
      const peers = arrows.map((_, j) => j).filter((j) => arrows[j].target === a.target && sd[j][1] === side);
      const k = peers.filter((j) => pos(j) < pos(i) || (pos(j) === pos(i) && j < i)).length;
      const from = starts[i], to = along(a.to, side, k, peers.length), o = OUT[sd[i][0]], io = OUT[side];
      const reach = Math.min(240, Math.max(24, Math.hypot(to[0] - from[0], to[1] - from[1]) * 0.45));
      return [from, [from[0] + o[0] * reach, from[1] + o[1] * reach], [to[0] + io[0] * reach, to[1] + io[1] * reach], to];
    });
  };
  const bez = (c, t) => {
    const u = 1 - t, w = [u * u * u, 3 * u * u * t, 3 * u * t * t, t * t * t];
    return [0, 1].map((k) => c.reduce((s, p, i) => s + p[k] * w[i], 0));
  };
  const head = (c, len, half) => {
    const d = [c[3][0] - c[2][0], c[3][1] - c[2][1]], n = Math.max(Math.hypot(d[0], d[1]), 1e-3);
    const dir = [d[0] / n, d[1] / n], base = [c[3][0] - dir[0] * len, c[3][1] - dir[1] * len];
    return [c[3], [base[0] - dir[1] * half, base[1] + dir[0] * half], [base[0] + dir[1] * half, base[1] - dir[0] * half]];
  };

  // The canvas's annotations in canvas units (as Design's scene.rs).
  const scene = () => {
    const sections = annot.sections.map((s) => ({ ...s, rects: s.boards.filter((id) => boards.has(id)).map((id) => boardRect(boards.get(id))) }))
      .filter((s) => s.rects.length);
    const arrows = [], ids = [...boards.keys()];
    for (const b of boards.values()) {
      for (const e of b.exits) {
        arrows.push({ fromBoard: b.id, from: { x: b.x + e.r.x, y: b.y + e.r.y, w: e.r.w, h: e.r.h }, to: e.to,
          label: e.label || null, name: e.label || e.text || null, el: e.el });
      }
    }
    for (const l of annot.links) {
      if (!boards.has(l.from) || !boards.has(l.to)) continue;
      arrows.push({ fromBoard: l.from, from: boardRect(boards.get(l.from)), to: l.to, label: l.label || null, name: l.label || null, el: null });
    }
    for (const a of arrows) a.target = ids.indexOf(a.to);
    const notes = [];
    for (const n of annot.notes) {
      if (n.board == null) { notes.push({ ...n, at: [n.x, n.y] }); continue; }
      const b = boards.get(n.board);
      if (!b) continue;
      if (!n.at) { notes.push({ ...n, at: [b.x + b.w, b.y] }); continue; }
      const r = b.anchors[n.n];
      if (r) notes.push({ ...n, at: [b.x + r.x + r.w, b.y + r.y] });
    }
    return { sections, arrows, notes };
  };
  const choices = (from) => {
    const out = [];
    for (const a of scene().arrows.filter((a) => a.fromBoard === from)) {
      const c = out.find((c) => c.to === a.to);
      if (!c) out.push({ to: a.to, name: a.name });
      else if (!c.name) c.name = a.name;
    }
    return out;
  };

  // Text that wraps or is hovered lives in HTML (#ink), built when the
  // annotations change and only moved on each frame; lines in SVG.
  let inkKey = null, inkSecs = [], inkLabels = [], inkNotes = [];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const buildInk = (s) => {
    ink.textContent = '';
    const div = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; ink.append(d); return d; };
    inkSecs = s.sections.map((x) => div('sec', `<div><b>${esc(x.title)}</b>` + (x.note ? `<span>${esc(x.note)}</span>` : '') + '</div>'));
    inkLabels = s.arrows.map((a) => (a.label ? div('lbl', esc(a.label)) : null));
    inkNotes = s.notes.map((n) => {
      const d = div('note', `<div class="dot">${n.n}</div><div class="card">${esc(n.text)}</div>`);
      d.querySelector('.dot').addEventListener('click', () => {
        if (!openNotes.delete(n.n)) openNotes.add(n.n);
        render();
      });
      return d;
    });
  };
  const render = () => {
    const s = scene();
    const key = JSON.stringify([s.sections.map((x) => [x.title, x.note]), s.arrows.map((a) => a.label), s.notes.map((n) => [n.n, n.text])]);
    if (key !== inkKey) { inkKey = key; buildInk(s); }
    const step = tour ? tour.path[tour.path.length - 1] : null;
    // Sections: regions under the boards, titles above them.
    let u = '';
    s.sections.forEach((x, i) => {
      const r = sectionBox(x.rects.map(scr));
      u += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="14" fill="rgba(255,255,255,.035)" stroke="#2b2e34"/>`;
      const el = inkSecs[i];
      el.style.left = r.x + 2 + 'px'; el.style.top = r.y - 5 + 'px';
      el.style.width = Math.min(640, Math.max(160, r.w)) + 'px';
    });
    under.innerHTML = u;
    // Arrows; the hovered exit and the tour's arrows bright, the rest dim.
    const curves = route(s.arrows.map((a) => ({ from: scr(a.from), to: scr(boardRect(boards.get(a.to))), target: a.target })));
    const weight = (a) => {
      if (hover && a.el && a.el === hover.el) return [1, 2.5];
      if (step) return a.fromBoard === step ? [1, 2] : [0.22, 1.5];
      return [0.8, 1.5];
    };
    let o = '';
    // Labels: the middle of the curve, else a little either side (no overlaps).
    const placed = [], spots = curves.map((c, i) => {
      const lbl = inkLabels[i];
      if (!lbl) return null;
      const w = lbl.offsetWidth, h = lbl.offsetHeight;
      const box = (t) => { const m = bez(c, t); return { m, x: m[0] - w / 2, y: m[1] - h / 2 }; };
      const free = (b) => !placed.some((p) => b.x < p.x + p.w && p.x < b.x + w && b.y < p.y + p.h && p.y < b.y + h);
      const spot = [0.5, 0.35, 0.65, 0.22, 0.78].map(box).find(free) || box(0.5);
      placed.push({ x: spot.x, y: spot.y, w, h });
      return spot.m;
    });
    const order = s.arrows.map((_, i) => i).sort((i, j) => weight(s.arrows[i])[0] - weight(s.arrows[j])[0]);
    for (const i of order) {
      const [a, w] = weight(s.arrows[i]), c = curves[i], col = `rgba(122,167,255,${a})`;
      o += `<path d="M${c[0]} C${c[1]} ${c[2]} ${c[3]}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
      o += `<circle cx="${c[0][0]}" cy="${c[0][1]}" r="${2.5 + w / 2}" fill="${col}"/>`;
      o += `<polygon points="${head(c, 9 + w, 4 + w / 2).join(' ')}" fill="${col}"/>`;
      const lbl = inkLabels[i];
      if (lbl) {
        const m = spots[i];
        lbl.style.left = m[0] + 'px'; lbl.style.top = m[1] + 'px';
        lbl.style.opacity = Math.max(a, 0.4); lbl.style.zIndex = a >= 1 ? 1 : 0;
      }
    }
    // The hovered link / exit, and the tour step's exits.
    const outline = (b, r, strong) => {
      const q = scr({ x: b.x + r.x, y: b.y + r.y, w: r.w, h: r.h });
      o += `<rect x="${q.x - 2}" y="${q.y - 2}" width="${q.w + 4}" height="${q.h + 4}" rx="4" fill="${strong ? 'rgba(122,167,255,.1)' : 'none'}"`
        + ` stroke="rgba(122,167,255,${strong ? 1 : 0.55})" stroke-width="${strong ? 1.5 : 1}"/>`;
    };
    for (const b of boards.values()) {
      for (const e of b.exits) if (b.id === step && !(hover && hover.el === e.el)) outline(b, e.r, false);
      for (const h of [...b.exits, ...b.links]) if (hover && hover.el === h.el) outline(b, h.r, true);
    }
    over.innerHTML = o;
    // Notes on top: markers always; cards open, on the tour's step, or hovered.
    s.notes.forEach((n, i) => {
      const el = inkNotes[i], x = cam.x + n.at[0] * cam.z, y = cam.y + n.at[1] * cam.z;
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.classList.toggle('flip', x + 14 + 304 > innerWidth - 8);
      el.classList.toggle('open', notesOpen || openNotes.has(n.n) || (step != null && n.board === step));
    });
    document.getElementById('notes-btn').classList.toggle('on', notesOpen);
    tourUi();
  };

  // ── Tours (as Design's tour.rs) ─────────────────────────────────────
  const frameBoard = (b) => {
    const W = innerWidth, H = innerHeight, pad = 48, reserve = 132;
    const aw = Math.max(W - 2 * pad, 1), ah = Math.max(H - 2 * pad - reserve, 1);
    const byWidth = Math.min(aw / b.w, 1), whole = Math.min(byWidth, ah / b.h);
    if (b.w * whole < 0.5 * aw && byWidth > whole) return { z: byWidth, x: W / 2 - (b.x + b.w / 2) * byWidth, y: 40 - b.y * byWidth };
    return { z: whole, x: W / 2 - (b.x + b.w / 2) * whole, y: (H - reserve) / 2 - (b.y + b.h / 2) * whole };
  };
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const lerp = (a, b, t) => {
    const mx = innerWidth / 2, my = innerHeight / 2;
    const ca = [(mx - a.x) / a.z, (my - a.y) / a.z], cb = [(mx - b.x) / b.z, (my - b.y) / b.z];
    const z = a.z * Math.pow(b.z / a.z, t), c = [ca[0] + (cb[0] - ca[0]) * t, ca[1] + (cb[1] - ca[1]) * t];
    return { z, x: mx - c[0] * z, y: my - c[1] * z };
  };
  const glideTo = (id) => {
    const b = boards.get(id);
    if (!b) return;
    glide = { from: { ...cam }, to: frameBoard(b), start: performance.now() };
    moved = true;
    const tick = (now) => {
      if (!glide) return;
      const t = (now - glide.start) / 420;
      cam = t >= 1 ? glide.to : lerp(glide.from, glide.to, ease(Math.max(t, 0)));
      if (t >= 1) glide = null;
      apply();
      if (glide) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const stepOf = () => tour.path[tour.path.length - 1];
  const go = (to) => { if (stepOf() !== to) tour.path.push(to); glideTo(to); };
  const follow = (from, to) => {
    if (!tour) tour = { flow: null, path: [from] };
    if (stepOf() !== from) tour.path.push(from);
    go(to);
  };
  const startFlow = (f) => { flowsOpen = false; tour = { flow: f.title, path: [f.start] }; glideTo(f.start); };
  const nav = (k) => {
    if (k === 'notes') { notesOpen = !notesOpen; render(); return; }
    if (k === 'end') { tour = null; flowsOpen = false; render(); return; }
    if (!tour) return;
    const c = choices(stepOf());
    if (k === 'back') { if (tour.path.length > 1) { tour.path.pop(); glideTo(stepOf()); } }
    else if (k === 'return') glideTo(stepOf());
    else if (k === 'next') { if (c.length === 1) go(c[0].to); }
    else if (typeof k === 'number' && c[k - 1]) go(c[k - 1].to);
    render();
  };
  const titleOf = (id) => (boards.has(id) ? boards.get(id).title.textContent : id);
  const button = (html, title, on) => {
    const el = document.createElement('button');
    el.innerHTML = html; el.title = title || '';
    if (on) el.onclick = on; else el.disabled = true;
    return el;
  };
  let tourKey = null;
  const tourUi = () => {
    const box = document.getElementById('tour'), list = document.getElementById('flows');
    const c = tour ? choices(stepOf()) : [];
    const key = tour ? JSON.stringify([tour, c]) : null;
    box.style.display = tour ? 'block' : 'none';
    list.style.display = !tour && flowsOpen ? 'block' : 'none';
    if (!tour && flowsOpen && !list.childElementCount) {
      for (const f of annot.flows) {
        list.append(button(`${esc(f.title)}${f.note ? `<small>${esc(f.note)}</small>` : ''}`, '', () => startFlow(f)));
      }
    }
    if (key === tourKey) return;
    tourKey = key; box.textContent = '';
    if (!tour) return;
    if (c.length > 1) {
      const picks = document.createElement('div'); picks.className = 'row picks';
      c.slice(0, 9).forEach((x, i) => picks.append(button(
        `${i + 1}&nbsp; ${x.name ? esc(x.name) + ' → ' : ''}${esc(titleOf(x.to))}`, '', () => nav(i + 1))));
      box.append(picks);
    }
    const row = document.createElement('div'); row.className = 'row';
    const where = document.createElement('div'); where.className = 'where';
    where.innerHTML = `<small>${tour.flow ? esc(tour.flow) + ' · ' : ''}Step ${tour.path.length}</small><b>${esc(titleOf(stepOf()))}</b>`;
    row.append(
      button('‹', 'Back (←)', tour.path.length > 1 ? () => nav('back') : null), where,
      button('›', 'Next (→)', c.length === 1 ? () => nav('next') : null));
    if (!c.length) { const end = document.createElement('small'); end.textContent = 'End of the flow'; row.append(end); }
    row.append(button('Return', 'Back to this step', () => nav('return')), button('×', 'End the tour (Esc)', () => nav('end')));
    box.append(row);
  };
  document.getElementById('notes-btn').onclick = () => nav('notes');
  document.getElementById('flows-btn').onclick = () => {
    flowsOpen = !flowsOpen;
    document.getElementById('flows').textContent = '';
    render();
  };

  const load = async () => {
    const data = await (await fetch('~canvas.json', { cache: 'no-store' })).json();
    const key = JSON.stringify(data);
    if (key !== layoutKey) { layoutKey = key; build(data); return true; }
    return false;
  };

  // Live: when a file changes, re-read the layout and reload the pages.
  const poll = async () => {
    try {
      const v = await (await fetch('~version', { cache: 'no-store' })).text();
      live.classList.remove('off');
      if (version !== null && v !== version) {
        if (!(await load())) for (const b of boards.values()) {
          try { b.frame.contentWindow.location.reload(); } catch (e) { b.frame.src = b.frame.src; }
        }
      }
      version = v;
    } catch (e) { live.classList.add('off'); }
    setTimeout(poll, 2000);
  };

  // The background: right-drag pans, wheel zooms; touch pans and pinches.
  plane.addEventListener('mousedown', (e) => { if (e.button === 2) { e.preventDefault(); startPan(e); } });
  addEventListener('mousemove', movePan);
  addEventListener('mouseup', (e) => { if (e.button === 2) endPan(); });
  addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('blur', endPan);
  plane.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  const touches = new Map();
  plane.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    plane.setPointerCapture(e.pointerId); touches.set(e.pointerId, e);
  });
  plane.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    const prev = touches.get(e.pointerId); touches.set(e.pointerId, e);
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      gesture({ x: a.clientX, y: a.clientY }, { x: b.clientX, y: b.clientY });
    } else {
      glide = null;
      cam.x += e.clientX - prev.clientX; cam.y += e.clientY - prev.clientY; moved = true; apply();
    }
  });
  const lift = (e) => { touches.delete(e.pointerId); pinch = null; };
  plane.addEventListener('pointerup', lift); plane.addEventListener('pointercancel', lift);

  const touch = matchMedia('(pointer: coarse)').matches;
  document.getElementById('help').textContent = touch
    ? 'Drag with two fingers to pan · Pinch to zoom'
    : 'Right-drag to pan · Scroll to zoom';
  document.getElementById('fit').onclick = () => { moved = false; fit(); };
  document.getElementById('in').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
  document.getElementById('out').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
  addEventListener('keydown', (e) => {
    if (e.target !== document.body && e.target.tagName !== 'BUTTON') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight') nav('next');
    else if (e.key === 'ArrowLeft') nav('back');
    else if (e.key === 'Escape') nav('end');
    else if (e.key === 'n' || e.key === 'N') nav('notes');
    else if (/^[1-9]$/.test(e.key) && tour) nav(+e.key);
    else if (e.key === '0') { moved = false; fit(); }
    else if (e.key === '+' || e.key === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
    else if (e.key === '-') zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
  });
  addEventListener('resize', () => { if (!moved) fit(); });

  load().then(poll).catch(() => { live.classList.add('off'); setTimeout(() => location.reload(), 5000); });
})();
</script>
</body>
</html>
