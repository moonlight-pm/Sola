<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Design</title>
<style>
  :root { --bg: #141518; --fg: #c9ccd2; --muted: #7d828c; --line: #2b2e34; --chip: #1d1f23; --accent: #7aa7ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  #plane { position: absolute; inset: 0; touch-action: none; }
  body.panning, body.panning * { cursor: grabbing !important; user-select: none; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .board { position: absolute; }
  .board iframe { display: block; border: 0; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.35); }
  .board .title { position: absolute; left: 0; bottom: 100%; padding-bottom: 8px; white-space: nowrap;
    color: var(--muted); transform-origin: 0 100%; }
  body.panning .board iframe { pointer-events: none; }
  #head { position: fixed; top: 14px; left: 16px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  #head .name { font-weight: 600; }
  #live { width: 7px; height: 7px; border-radius: 50%; background: #4bbf73; box-shadow: 0 0 0 3px rgba(75,191,115,.15); }
  #live.off { background: var(--muted); box-shadow: none; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; align-items: center;
    padding: 4px; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #bar button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 7px; color: var(--fg); }
  #bar button:hover { background: #26292e; }
  #pct { min-width: 48px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; color: var(--muted); }
  #help { position: fixed; left: 16px; bottom: 22px; color: var(--muted); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="plane"><div id="world"></div></div>
<div id="head"><span id="live" title="Live"></span><span class="name" id="name"></span></div>
<div id="bar">
  <button id="out" title="Zoom out (-)">−</button><span id="pct">100%</span><button id="in" title="Zoom in (+)">+</button>
  <button id="fit" title="Fit (0)">Fit</button>
</div>
<div id="help"></div>
<div id="msg"></div>
<script>
(() => {
  const plane = document.getElementById('plane'), world = document.getElementById('world');
  const pct = document.getElementById('pct'), live = document.getElementById('live');
  let cam = { x: 48, y: 48, z: 1 }, moved = false, boards = new Map(), version = null, layoutKey = '';

  const apply = () => {
    world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
    pct.textContent = Math.round(cam.z * 100) + '%';
    for (const b of boards.values()) b.title.style.transform = `scale(${1 / cam.z})`;
  };
  const zoomAt = (px, py, f) => {
    const z = Math.min(32, Math.max(0.05, cam.z * f));
    cam.x = px - (px - cam.x) * (z / cam.z); cam.y = py - (py - cam.y) * (z / cam.z); cam.z = z;
    moved = true; apply();
  };
  const fit = () => {
    if (!boards.size) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const b of boards.values()) {
      x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
      x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
    }
    const pad = 56, W = innerWidth, H = innerHeight;
    const z = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad - 40) / (y1 - y0), 1);
    cam = { z, x: (W - (x1 - x0) * z) / 2 - x0 * z, y: (H - 40 - (y1 - y0) * z) / 2 - y0 * z + 20 };
    apply();
  };

  // Height of an `auto` board: its page's content, measured a few times as
  // fonts and images arrive.
  const measure = (b) => {
    if (!b.auto) return;
    try {
      const doc = b.frame.contentDocument;
      const h = Math.ceil(Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0));
      if (h > 0 && h !== b.h) { b.h = h; b.frame.style.height = h + 'px'; if (!moved) fit(); }
    } catch (e) { /* not same-origin (a web src) */ }
  };

  // As in Design: pages are live (left button, hover, keys), the right
  // button drags the canvas anywhere — the pages never see it — and the
  // wheel always zooms. Touch: two fingers pan and pinch over a page, one
  // finger pans on the background.
  let pan = null;
  const startPan = (e) => { pan = { x: e.screenX, y: e.screenY }; document.body.classList.add('panning'); };
  const movePan = (e) => {
    if (!pan) return;
    cam.x += e.screenX - pan.x; cam.y += e.screenY - pan.y; pan = { x: e.screenX, y: e.screenY };
    moved = true; apply();
  };
  const endPan = () => { pan = null; document.body.classList.remove('panning'); };
  // Pinch / two-finger pan from client points already in this window.
  let pinch = null;
  const gesture = (a, b) => {
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch) { cam.x += mx - pinch.mx; cam.y += my - pinch.my; zoomAt(mx, my, d / pinch.d); }
    pinch = { d, mx, my };
  };

  const hookPage = (b) => {
    let win;
    try { win = b.frame.contentWindow; void win.document; } catch (e) { return; } // web src
    const toHere = (x, y) => {
      const r = b.frame.getBoundingClientRect(), s = r.width / b.frame.clientWidth;
      return { x: r.left + x * s, y: r.top + y * s };
    };
    const swallow = (e) => { e.preventDefault(); e.stopImmediatePropagation(); };
    const right = (e) => e.button === 2;
    win.addEventListener('pointerdown', (e) => { if (right(e)) swallow(e); }, true);
    win.addEventListener('pointerup', (e) => { if (right(e)) swallow(e); }, true);
    win.addEventListener('mousedown', (e) => { if (right(e)) { swallow(e); startPan(e); } }, true);
    win.addEventListener('mousemove', (e) => { if (pan) { e.stopImmediatePropagation(); movePan(e); } }, true);
    win.addEventListener('mouseup', (e) => { if (right(e) && pan) { swallow(e); endPan(); } }, true);
    win.addEventListener('contextmenu', swallow, true);
    win.addEventListener('wheel', (e) => {
      e.preventDefault();
      const p = toHere(e.clientX, e.clientY);
      zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0015));
    }, { passive: false });
    const twoFingers = (e) => {
      if (e.touches.length !== 2) { pinch = null; return; }
      e.preventDefault();
      gesture(toHere(e.touches[0].clientX, e.touches[0].clientY), toHere(e.touches[1].clientX, e.touches[1].clientY));
    };
    win.addEventListener('touchstart', twoFingers, { passive: false, capture: true });
    win.addEventListener('touchmove', twoFingers, { passive: false, capture: true });
    win.addEventListener('touchend', () => { pinch = null; }, true);
  };

  const build = (data) => {
    document.getElementById('name').textContent = data.title || '';
    document.title = (data.title || 'Canvas') + ' — Design';
    const msg = document.getElementById('msg');
    msg.style.display = data.error ? 'grid' : 'none';
    msg.textContent = data.error || '';
    world.textContent = ''; boards.clear();
    for (const a of data.artboards) {
      const el = document.createElement('div'); el.className = 'board';
      el.style.left = a.x + 'px'; el.style.top = a.y + 'px';
      const title = document.createElement('div'); title.className = 'title'; title.textContent = a.title;
      const frame = document.createElement('iframe');
      frame.src = a.src; frame.title = a.title;
      frame.style.width = a.width + 'px'; frame.style.height = a.height + 'px';
      el.append(title, frame); world.append(el);
      const b = { x: a.x, y: a.y, w: a.width, h: a.height, auto: a.auto, frame, title };
      frame.addEventListener('load', () => {
        hookPage(b); measure(b);
        try { b.frame.contentDocument.fonts.ready.then(() => measure(b)); } catch (e) {}
        for (const ms of [1000, 3000, 8000]) setTimeout(() => measure(b), ms);
      });
      boards.set(a.id, b);
    }
    if (!moved) fit(); else apply();
  };

  const load = async () => {
    const data = await (await fetch('~canvas.json', { cache: 'no-store' })).json();
    const key = JSON.stringify(data);
    if (key !== layoutKey) { layoutKey = key; build(data); return true; }
    return false;
  };

  // Live: when a file changes, re-read the layout and reload the pages.
  const poll = async () => {
    try {
      const v = await (await fetch('~version', { cache: 'no-store' })).text();
      live.classList.remove('off');
      if (version !== null && v !== version) {
        if (!(await load())) for (const b of boards.values()) {
          try { b.frame.contentWindow.location.reload(); } catch (e) { b.frame.src = b.frame.src; }
        }
      }
      version = v;
    } catch (e) { live.classList.add('off'); }
    setTimeout(poll, 2000);
  };

  // The background: right-drag pans, wheel zooms; touch pans and pinches.
  plane.addEventListener('mousedown', (e) => { if (e.button === 2) { e.preventDefault(); startPan(e); } });
  addEventListener('mousemove', movePan);
  addEventListener('mouseup', (e) => { if (e.button === 2) endPan(); });
  addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('blur', endPan);
  plane.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  const touches = new Map();
  plane.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'touch') return;
    plane.setPointerCapture(e.pointerId); touches.set(e.pointerId, e);
  });
  plane.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    const prev = touches.get(e.pointerId); touches.set(e.pointerId, e);
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      gesture({ x: a.clientX, y: a.clientY }, { x: b.clientX, y: b.clientY });
    } else {
      cam.x += e.clientX - prev.clientX; cam.y += e.clientY - prev.clientY; moved = true; apply();
    }
  });
  const lift = (e) => { touches.delete(e.pointerId); pinch = null; };
  plane.addEventListener('pointerup', lift); plane.addEventListener('pointercancel', lift);

  const touch = matchMedia('(pointer: coarse)').matches;
  document.getElementById('help').textContent = touch
    ? 'Drag with two fingers to pan · Pinch to zoom'
    : 'Right-drag to pan · Scroll to zoom';
  document.getElementById('fit').onclick = () => { moved = false; fit(); };
  document.getElementById('in').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
  document.getElementById('out').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
  addEventListener('keydown', (e) => {
    if (e.target !== document.body) return;
    if (e.key === '0') { moved = false; fit(); }
    else if (e.key === '+' || e.key === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
    else if (e.key === '-') zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
  });
  addEventListener('resize', () => { if (!moved) fit(); });

  load().then(poll).catch(() => { live.classList.add('off'); setTimeout(() => location.reload(), 5000); });
})();
</script>
</body>
</html>
