<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Design</title>
<style>
  :root { --bg: #141518; --fg: #c9ccd2; --muted: #7d828c; --line: #2b2e34; --chip: #1d1f23; --accent: #3dd6f5; --note: #e3b341; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  #plane { position: absolute; inset: 0; touch-action: none; }
  body.panning, body.panning * { cursor: grabbing !important; user-select: none; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .board { position: absolute; }
  .board iframe { display: block; border: 0; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.35); }
  /* As in Design: 12px at any zoom, 6px above the board, cut at its width. */
  .board .title { position: absolute; left: 0; bottom: 100%; padding-bottom: 6px; font-size: 12px; line-height: 16px;
    white-space: nowrap; overflow: hidden; color: var(--muted); transform-origin: 0 100%; pointer-events: none; }
  body.panning .board iframe { pointer-events: none; }
  #head { position: fixed; top: 14px; left: 16px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  #head .name { font-weight: 600; }
  #live { width: 7px; height: 7px; border-radius: 50%; background: #4bbf73; box-shadow: 0 0 0 3px rgba(75,191,115,.15); }
  #live.off { background: var(--muted); box-shadow: none; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; align-items: center;
    padding: 4px; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #bar button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 7px; color: var(--fg); }
  #bar button:hover { background: #26292e; }
  #pct { min-width: 48px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; color: var(--muted); }
  #help { position: fixed; left: 16px; bottom: 22px; color: var(--muted); font-size: 12px; pointer-events: none; }
  /* Annotations, as in Design: fixed sizes on screen, drawn over the plane. */
  #under, #over { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #ink { position: absolute; inset: 0; pointer-events: none; }
  .sec { position: absolute; transform: translateY(-100%); }
  .sec > div { display: inline-block; margin: 0 0 0 -6px; padding: 3px 6px; border-radius: 6px; background: rgba(20,21,24,.88); }
  .sec b { display: block; font-size: 15px; font-weight: 500; line-height: 20px; color: var(--fg); }
  .sec span { display: block; font-size: 12px; line-height: 16px; color: var(--muted); margin-top: 3px; }
  .lbl { position: absolute; transform: translate(-50%, -50%); padding: 2px 7px; border: 1px solid rgba(201,204,210,.18);
    border-radius: 7px; background: var(--chip); color: rgba(201,204,210,.72); font-size: 11px; line-height: 15px; white-space: nowrap; }
  .lbl.lit { border-color: var(--accent); color: var(--fg); }
  .lbl.dim { border-color: rgba(201,204,210,.08); color: rgba(201,204,210,.3); background: rgba(29,31,35,.7); }
  .note { position: absolute; width: 0; height: 0; pointer-events: auto; }
  .note .dot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    background: var(--note); color: #1a1407; box-shadow: 0 0 0 1.5px var(--bg); font: 500 11px/18px system-ui, sans-serif;
    text-align: center; user-select: none; }
  .note .card { visibility: hidden; position: absolute; left: 14px; top: -12px; width: max-content; max-width: 280px;
    padding: 9px 11px; border: 1px solid rgba(227,179,65,.75); border-radius: 8px; background: var(--chip);
    font-size: 12px; line-height: 16px; white-space: pre-wrap; }
  .note.open .card, .note:hover .card, .note.hot .card { visibility: visible; }
  .note:hover, .note.hot { z-index: 2; }
  .note.ping .dot { animation: ping .9s ease-out 2; }
  @keyframes ping { from { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 0 rgba(227,179,65,.8); }
    to { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 14px rgba(227,179,65,0); } }
  /* On a tour, a click in a page that leads nowhere flashes what does lead
     on from that board (a prototype's hotspot hints). */
  #hints { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  #hints.on { animation: hints 1.2s ease-out; }
  #hints div { position: absolute; border-radius: 4px; background: rgba(61,214,245,.16); box-shadow: 0 0 0 1.5px var(--accent); }
  @keyframes hints { 0%, 50% { opacity: 1; } 100% { opacity: 0; } }
  /* On a tour, the step's ways on and its notes, at the right edge. */
  #side { position: fixed; top: 14px; right: 16px; width: 272px; max-height: calc(100% - 200px); display: none;
    flex-direction: column; background: var(--chip); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); overflow: hidden; }
  #side.on { display: flex; }
  #side.folded { width: auto; }
  @media (max-width: 700px) { #side { top: 44px; max-width: calc(100% - 32px); } }
  #side header { display: flex; gap: 8px; align-items: center; padding: 8px 8px 8px 12px; }
  #side header div { flex: 1; min-width: 0; }
  #side header b { font-weight: 500; }
  #side header small { display: block; color: var(--muted); font-size: 12px; }
  #side .body { overflow-y: auto; overscroll-behavior: contain; padding-bottom: 6px; border-top: 1px solid var(--line); }
  #side h3 { margin: 10px 12px 4px; font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  #side button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 9px; align-items: flex-start;
    width: 100%; padding: 6px 12px; }
  #side button:hover, #side button:focus-visible { background: #26292e; }
  #side header button { width: auto; flex: none; padding: 3px 8px; border-radius: 6px; color: var(--muted); }
  #side .key { flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 5px;
    color: var(--muted); font-size: 11px; line-height: 16px; text-align: center; }
  #side .n { flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid var(--note); border-radius: 50%;
    color: var(--note); font: 500 11px/15px system-ui, sans-serif; text-align: center; }
  #side .open .n { background: var(--note); color: #1a1407; }
  #side .t { min-width: 0; font-size: 12px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; }
  #side .none { margin: 2px 12px 4px; color: var(--muted); font-size: 12px; }
  .pop { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); display: none; padding: 6px 8px;
    background: var(--chip); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .pop button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 7px; color: var(--fg); }
  .pop button:hover { background: #26292e; }
  .pop button:disabled { opacity: .35; cursor: default; background: none; }
  #flows button { display: block; width: 300px; }
  #flows small, #tour small { display: block; color: var(--muted); font-size: 12px; }
  #tour .row { display: flex; gap: 4px; align-items: center; justify-content: center; }
  #tour .picks { flex-wrap: wrap; margin-bottom: 6px; }
  #tour .picks button { border: 1px solid var(--line); }
  #tour .where { padding: 0 6px; min-width: 120px; }
  #tour .where b { font-weight: 500; }
  #bar button.on { color: var(--accent); }
  /* Too narrow for the hint beside the zoom bar: centre it above. */
  @media (max-width: 860px) { #help { right: 16px; bottom: 64px; text-align: center; } }
  /* Touch: pages take no input (the canvas gets every finger) and the
     gestures need no hint. */
  body.touch .board iframe { pointer-events: none; }
  body.touch #help, body.touch #pad-btn { display: none; }
  /* A sideways swipe with Trackpad mode off: point at the button. */
  #bar button.nudge:not(.on) { animation: nudge 1.1s ease-in-out 3; }
  @keyframes nudge { 50% { background: rgba(61,214,245,.18); color: var(--accent); } }
</style>
</head>
<body>
<div id="plane"><svg id="under"></svg><div id="world"></div><svg id="over"></svg><div id="hints"></div><div id="ink"></div></div>
<div id="head"><span id="live" title="Live"></span><span class="name" id="name"></span></div>
<div id="bar">
  <button id="out" title="Zoom out (-)">−</button><span id="pct">100%</span><button id="in" title="Zoom in (+)">+</button>
  <button id="fit" title="Fit (0)">Fit</button>
  <button id="pad-btn" title="Trackpad mode: two fingers pan, pinch zooms (T)">Trackpad</button>
  <button id="notes-btn" title="Show every note (N)" hidden>Notes</button>
  <button id="flows-btn" title="Walk a flow" hidden>Flows</button>
</div>
<div id="flows" class="pop"></div>
<div id="tour" class="pop"></div>
<aside id="side" aria-label="This step"></aside>
<div id="help">Right-drag to pan · Scroll to zoom</div>
<div id="msg"></div>
<script>
(() => {
  const plane = document.getElementById('plane'), world = document.getElementById('world');
  const pct = document.getElementById('pct'), live = document.getElementById('live');
  // Touch mode (a phone): pages take no input, one finger pans, two pinch.
  // Set from the device, and by the input actually used.
  const touchMode = (on) => document.body.classList.toggle('touch', on);
  let cam = { x: 48, y: 48, z: 1 }, moved = false, boards = new Map(), version = null, layoutKey = '';
  // canvas.toml annotations; what the pointer is over in a page; the tour.
  let annot = { sections: [], links: [], notes: [], flows: [] }, hover = null, tour = null, glide = null;
  // Notes (as Design's tour.rs Notes): on a tour step its notes are open
  // ('step'), or every note is ('all') or none is ('hidden'); a click on a
  // marker flips that one note from what the mode says.
  let notesMode = 'step', flowsOpen = false;
  const flipped = new Set();
  const noteOpen = (n) => {
    const step = tour ? tour.path[tour.path.length - 1] : null;
    const byMode = notesMode === 'all' || (notesMode === 'step' && step != null && n.board === step);
    return byMode !== flipped.has(n.n);
  };

  const apply = () => {
    world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
    pct.textContent = Math.round(cam.z * 100) + '%';
    for (const b of boards.values()) {
      b.title.style.transform = `scale(${1 / cam.z})`;
      b.title.style.maxWidth = b.w * cam.z + 'px';
    }
    render();
  };
  const clampZ = (z) => Math.min(32, Math.max(0.05, z));
  const zoomAt = (px, py, f) => {
    glide = null;
    const z = clampZ(cam.z * f);
    cam.x = px - (px - cam.x) * (z / cam.z); cam.y = py - (py - cam.y) * (z / cam.z); cam.z = z;
    moved = true; apply();
  };
  const fit = () => {
    if (!boards.size) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const b of boards.values()) {
      x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
      x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
    }
    // Room above for section titles, as in Design.
    const pad = 56, W = innerWidth, H = innerHeight, top = annot.sections.length ? 44 : 0;
    const z = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad - 40 - top) / (y1 - y0), 1);
    cam = { z, x: (W - (x1 - x0) * z) / 2 - x0 * z, y: (H - 40 - top - (y1 - y0) * z) / 2 - y0 * z + 20 + top };
    apply();
  };

  // Height of an `auto` board Design has not measured: its page's content
  // (Design's formula — not the viewport, which starts at 900), measured a
  // few times as fonts and images arrive. Design's own height wins.
  const measure = (b) => {
    if (!b.auto || b.measured) return;
    try {
      const doc = b.frame.contentDocument;
      const h = Math.ceil(Math.max(doc.body ? doc.body.scrollHeight : 0,
        doc.documentElement.getBoundingClientRect().height));
      if (h > 0 && h !== b.h) { b.h = h; b.frame.style.height = h + 'px'; if (!moved) fit(); }
    } catch (e) { /* not same-origin (a web src) */ }
  };

  // What a page declares (as Design reads it when a board settles): its
  // exits, its plain links that lead to another board, and the elements
  // notes are pinned to. Rects are board-local CSS px.
  const words = (s) => (s || '').trim().replace(/\s+/g, ' ').slice(0, 60);
  const pageKey = (u) => {
    try { const x = new URL(u, location.href); return { page: x.origin + x.pathname + x.search, hash: x.hash }; }
    catch (e) { return null; }
  };
  // As Design (marks.rs): a link to the board's own page goes nowhere unless
  // its fragment names another board's; one that fits several, nowhere.
  const boardFor = (href, from) => {
    const want = pageKey(href), own = boards.has(from) && boards.get(from).key;
    if (!want) return null;
    const hits = [...boards.values()].filter((b) => b.id !== from && b.key && b.key.page === want.page);
    const named = hits.filter((b) => b.key.hash === want.hash);
    const byHash = named.length === 1 ? named[0].id : null;
    if (own && own.page === want.page) return own.hash !== want.hash ? byHash : null;
    return hits.length === 1 ? hits[0].id : byHash;
  };
  const scan = (b) => {
    let doc;
    try { doc = b.frame.contentDocument; void doc.body; } catch (e) { return; }
    if (!doc || !doc.body) return;
    const box = (el) => { const r = el.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
    const seen = (r) => r.w > 0 && r.h > 0;
    b.exits = [...doc.querySelectorAll('[data-design-to]')].slice(0, 100).map((el) => ({
      el, to: el.getAttribute('data-design-to').trim(), label: (el.getAttribute('data-design-label') || '').trim(),
      text: words(el.innerText || el.getAttribute('aria-label')), r: box(el),
    })).filter((e) => e.to && e.to !== b.id && boards.has(e.to) && seen(e.r));
    b.links = [...doc.querySelectorAll('a[href]')].filter((a) => !a.closest('[data-design-to]')).slice(0, 300)
      .map((a) => ({ el: a, to: boardFor(a.href, b.id), r: box(a) })).filter((l) => l.to && seen(l.r));
    b.anchors = {};
    for (const n of annot.notes) {
      if (n.board !== b.id || !n.at) continue;
      let el = null;
      try { el = doc.querySelector(n.at); } catch (e) {}
      b.anchors[n.n] = el ? box(el) : null;
    }
    render();
  };

  // As in Design: pages are live (left button, hover, keys), the right
  // button drags the canvas anywhere — the pages never see it — and the
  // wheel always zooms (Trackpad mode, below, is the one exception).
  // Pointer events drive the pan: a page cancels the right pointerdown,
  // and that also stops the browser's mousedown / mousemove / mouseup for
  // the press.
  let pan = null;
  const startPan = (e) => { pan = { x: e.screenX, y: e.screenY }; document.body.classList.add('panning'); };
  const movePan = (e) => {
    if (!pan) return;
    glide = null;
    cam.x += e.screenX - pan.x; cam.y += e.screenY - pan.y; pan = { x: e.screenX, y: e.screenY };
    moved = true; apply();
  };
  const endPan = () => { pan = null; document.body.classList.remove('panning'); };
  // Trackpad mode (the bar's Trackpad button, or T; this browser remembers
  // it): two-finger scrolling pans, a pinch (ctrl+wheel) zooms. Off, the
  // wheel zooms as in Design. A sideways swipe with it off points at the
  // button once. A Safari pinch (gesture events) zooms either way.
  let trackpad = false, nudged = false;
  try { trackpad = localStorage.getItem('design.trackpad') === '1'; } catch (e) {}
  const padUi = () => {
    document.getElementById('pad-btn').classList.toggle('on', trackpad);
    document.getElementById('help').textContent = trackpad
      ? 'Two fingers to pan · Pinch to zoom' : 'Right-drag to pan · Scroll to zoom';
  };
  const setTrackpad = (on) => {
    trackpad = on;
    try { localStorage.setItem('design.trackpad', on ? '1' : '0'); } catch (e) {}
    padUi();
  };
  const wheel = (x, y, e) => {
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
    const dx = e.deltaX * unit, dy = e.deltaY * unit;
    if (!trackpad) {
      if (dx && !nudged) { nudged = true; document.getElementById('pad-btn').classList.add('nudge'); }
      zoomAt(x, y, Math.exp(-dy * 0.0015));
    } else if (e.ctrlKey) {
      zoomAt(x, y, Math.exp(-Math.max(-50, Math.min(50, dy)) * 0.01));
    } else {
      glide = null;
      cam.x -= dx; cam.y -= dy; moved = true; apply();
    }
  };
  // Safari pinch, over the viewer or a page (`at` maps the event's point).
  const gestures = (target, at) => {
    let last = 1;
    target.addEventListener('gesturestart', (e) => { e.preventDefault(); last = 1; });
    target.addEventListener('gesturechange', (e) => {
      e.preventDefault();
      if (document.body.classList.contains('touch')) return; // a phone pinches with fingers (below)
      const p = at(e.clientX, e.clientY);
      zoomAt(p.x, p.y, e.scale / last);
      last = e.scale;
    });
  };
  // Touch, on the background only (pages are inert): one finger pans; two
  // only zoom — about the point where the pinch began, by how far apart the
  // fingers are now — so nothing drifts and no pan is mixed in.
  const fingers = new Map();
  let pinch = null;
  const regrip = () => {
    pinch = null;
    if (fingers.size !== 2) return;
    const [a, b] = [...fingers.values()];
    pinch = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y), cam: { ...cam } };
  };
  const fingerDown = (id, p) => { fingers.set(id, p); regrip(); };
  const fingerUp = (id) => { fingers.delete(id); regrip(); };
  const fingerMove = (id, p) => {
    const prev = fingers.get(id);
    if (!prev) return;
    fingers.set(id, p);
    glide = null;
    if (fingers.size === 1) {
      cam.x += p.x - prev.x; cam.y += p.y - prev.y; moved = true; apply();
    } else if (pinch && pinch.d > 0) {
      const [a, b] = [...fingers.values()];
      const z = clampZ(pinch.cam.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d), k = z / pinch.cam.z;
      cam = { z, x: pinch.x - (pinch.x - pinch.cam.x) * k, y: pinch.y - (pinch.y - pinch.cam.y) * k };
      moved = true; apply();
    }
  };

  const hookPage = (b) => {
    let win;
    try { win = b.frame.contentWindow; void win.document; } catch (e) { return; } // web src
    const toHere = (x, y) => {
      const r = b.frame.getBoundingClientRect(), s = r.width / b.frame.clientWidth;
      return { x: r.left + x * s, y: r.top + y * s };
    };
    // No scrollbars (they would also take layout width), no native gestures.
    try {
      const style = win.document.createElement('style');
      style.textContent = 'html { scrollbar-width: none; touch-action: none; } html::-webkit-scrollbar { display: none; }';
      win.document.head.append(style);
    } catch (e) {}
    const swallow = (e) => { e.preventDefault(); e.stopImmediatePropagation(); };
    const right = (e) => e.button === 2;
    // A touch on a page means a phone the device check missed: pages go
    // inert from here (this first touch does nothing, the next one pans).
    const inert = (e) => { if (e.pointerType !== 'mouse') { swallow(e); touchMode(true); } };
    for (const type of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel']) win.addEventListener(type, inert, true);
    for (const type of ['touchstart', 'touchmove']) win.addEventListener(type, swallow, { passive: false, capture: true });
    win.addEventListener('pointerdown', (e) => { if (right(e)) { swallow(e); startPan(e); } }, true);
    win.addEventListener('pointermove', (e) => { if (pan) { e.stopImmediatePropagation(); movePan(e); } }, true);
    win.addEventListener('pointerup', (e) => { if (right(e)) { swallow(e); endPan(); } }, true);
    win.addEventListener('mousedown', (e) => { if (right(e)) swallow(e); }, true);
    win.addEventListener('mousemove', (e) => { if (pan) e.stopImmediatePropagation(); }, true);
    win.addEventListener('mouseup', (e) => { if (right(e)) swallow(e); }, true);
    win.addEventListener('contextmenu', swallow, true);
    // An exit, or a plain link to another board's page: the camera goes
    // there; the page does not get the click. On a tour, any other click
    // flashes what leads on from this board (the page still gets it).
    const target = (el) => {
      if (!el) return null;
      const to = el.hasAttribute('data-design-to') ? el.getAttribute('data-design-to').trim() : boardFor(el.href, b.id);
      return to && to !== b.id && boards.has(to) ? to : null;
    };
    const hotEl = (e) => (e.target && e.target.closest ? e.target.closest('[data-design-to], a[href]') : null);
    win.addEventListener('click', (e) => {
      if (e.button !== 0) return;
      const to = target(hotEl(e));
      if (!to) { if (tour) flash(b.id); return; }
      swallow(e);
      follow(b.id, to);
    }, true);
    win.addEventListener('mouseover', (e) => {
      const el = hotEl(e), to = target(el);
      const h = to ? { board: b.id, el } : null;
      if ((h && h.el) !== (hover && hover.el)) { hover = h; render(); }
    }, true);
    win.document.documentElement.addEventListener('mouseleave', () => { if (hover) { hover = null; render(); } });
    win.addEventListener('wheel', (e) => {
      e.preventDefault();
      const p = toHere(e.clientX, e.clientY);
      wheel(p.x, p.y, e);
    }, { passive: false });
    gestures(win, toHere);
  };

  const build = (data) => {
    document.getElementById('name').textContent = data.title || '';
    document.title = (data.title || 'Canvas') + ' — Design';
    const msg = document.getElementById('msg');
    msg.style.display = data.error ? 'grid' : 'none';
    msg.textContent = data.error || '';
    world.textContent = ''; boards.clear();
    annot = { sections: data.sections || [], links: data.links || [], notes: data.notes || [], flows: data.flows || [] };

      o += `<path d="${rounded(path, 10)}" fill="none" style="stroke:${col}" stroke-width="${w}"/>`;
      o += `<circle cx="${path[0][0]}" cy="${path[0][1]}" r="${2 + w / 2}" style="fill:${col}"/>`;
      const tip = path[path.length - 1], prev = path[path.length - 2];
      const len = Math.hypot(tip[0] - prev[0], tip[1] - prev[1]) || 1, dir = [(tip[0] - prev[0]) / len, (tip[1] - prev[1]) / len];
      const base = [tip[0] - dir[0] * (8 + w), tip[1] - dir[1] * (8 + w)], half = 3.5 + w / 2;
      o += `<polygon points="${tip} ${base[0] - dir[1] * half},${base[1] + dir[0] * half} ${base[0] + dir[1] * half},${base[1] - dir[0] * half}" style="fill:${col}"/>`;
      const lbl = inkLabels[i];
      if (lbl && !spots[i]) lbl.style.display = 'none';
      else if (lbl) {
        lbl.style.left = spots[i][0] + 'px'; lbl.style.top = spots[i][1] + 'px';
        lbl.className = 'lbl ' + ['dim', 'plain', 'lit'][lk]; lbl.style.zIndex = lk;
      }
    }
    // The hovered link / exit, and the tour step's exits.
    const outline = (b, r, strong) => {
      const q = scr({ x: b.x + r.x, y: b.y + r.y, w: r.w, h: r.h });
      o += `<rect x="${q.x - 2}" y="${q.y - 2}" width="${q.w + 4}" height="${q.h + 4}" rx="4" fill="${strong ? 'rgba(61,214,245,.1)' : 'none'}"`
        + ` stroke="rgba(61,214,245,${strong ? 1 : 0.55})" stroke-width="${strong ? 1.5 : 1}"/>`;
    };
    for (const b of boards.values()) {
      for (const e of b.exits) if (b.id === step && !(hover && hover.el === e.el)) outline(b, e.r, false);
      for (const h of [...b.exits, ...b.links]) if (hover && hover.el === h.el) outline(b, h.r, true);
    }
    over.innerHTML = o;
    if (hints && boards.has(hints)) {
      const b = boards.get(hints);
      hintsEl.innerHTML = [...b.exits, ...b.links].map((h) => {
        const q = scr({ x: b.x + h.r.x, y: b.y + h.r.y, w: h.r.w, h: h.r.h });
        return `<div style="left:${q.x - 3}px;top:${q.y - 3}px;width:${q.w + 6}px;height:${q.h + 6}px"></div>`;
      }).join('');
    }
    // Notes on top: markers always; cards open (see noteOpen), or hovered
    // here or in the side list. A card goes beside its marker where it
    // covers no title, other card, or marker — and no board, if it can (as
    // Design's card_spot).
    const marks = s.notes.map((n) => [cam.x + n.at[0] * cam.z, cam.y + n.at[1] * cam.z]);
    const keep = [...screens.map((r) => ({ x: r.x, y: r.y - 22, w: r.w, h: 20 })),
      ...inkSecs.map((el) => { const q = el.firstChild.getBoundingClientRect(); return { x: q.x, y: q.y, w: q.width, h: q.height }; })];
    const noteOrder = s.notes.map((_, i) => i).sort((i, j) => noteOpen(s.notes[j]) - noteOpen(s.notes[i]));
    for (const i of noteOrder) {
      const n = s.notes[i], el = inkNotes[i], [x, y] = marks[i], card = el.lastChild;
      el.style.left = x + 'px'; el.style.top = y + 'px';
      // A marker off screen has no card (it would pile up at the edge).
      const shown = x >= 0 && y >= 0 && x <= innerWidth && y <= innerHeight;
      el.style.display = shown ? '' : 'none';
      if (!shown) continue;
      el.classList.toggle('open', noteOpen(n));
      const others = marks.filter((_, j) => j !== i).map(([mx, my]) => ({ x: mx - 9, y: my - 9, w: 18, h: 18 }));
      const spot = cardSpot([x, y], card.offsetWidth, card.offsetHeight, [...keep, ...others], screens);
      card.style.left = spot.x - x + 'px'; card.style.top = spot.y - y + 'px';
      if (noteOpen(n)) keep.push(spot);
    }
    const anyOpen = s.notes.some(noteOpen), notesBtn = document.getElementById('notes-btn');
    notesBtn.classList.toggle('on', anyOpen);
    notesBtn.title = anyOpen ? 'Hide every note (N)' : 'Show every note (N)';
    tourUi();
    sideUi(s);
  };

  // ── Tours (as Design's tour.rs) ─────────────────────────────────────
  const frameBoard = (b) => {
    // The step goes left of the side list when that is open.
    const W = innerWidth - sideRoom(), H = innerHeight, pad = 48, reserve = 132;
    const aw = Math.max(W - 2 * pad, 1), ah = Math.max(H - 2 * pad - reserve, 1);
    const byWidth = Math.min(aw / b.w, 1), whole = Math.min(byWidth, ah / b.h);
    if (b.w * whole < 0.5 * aw && byWidth > whole) return { z: byWidth, x: W / 2 - (b.x + b.w / 2) * byWidth, y: 40 - b.y * byWidth };
    return { z: whole, x: W / 2 - (b.x + b.w / 2) * whole, y: (H - reserve) / 2 - (b.y + b.h / 2) * whole };
  };
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const lerp = (a, b, t) => {
    const mx = innerWidth / 2, my = innerHeight / 2;
    const ca = [(mx - a.x) / a.z, (my - a.y) / a.z], cb = [(mx - b.x) / b.z, (my - b.y) / b.z];
    const z = a.z * Math.pow(b.z / a.z, t), c = [ca[0] + (cb[0] - ca[0]) * t, ca[1] + (cb[1] - ca[1]) * t];
    return { z, x: mx - c[0] * z, y: my - c[1] * z };
  };
  const glideTo = (id) => {
    const b = boards.get(id);
    if (!b) return;
    glide = { from: { ...cam }, to: frameBoard(b), start: performance.now() };
    moved = true;
    const tick = (now) => {
      if (!glide) return;
      const t = (now - glide.start) / 420;
      cam = t >= 1 ? glide.to : lerp(glide.from, glide.to, ease(Math.max(t, 0)));
      if (t >= 1) glide = null;
      apply();
      if (glide) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const stepOf = () => tour.path[tour.path.length - 1];
  const go = (to) => { if (stepOf() !== to) tour.path.push(to); glideTo(to); };
  const follow = (from, to) => {
    if (!tour) tour = { flow: null, path: [from] };
    if (stepOf() !== from) tour.path.push(from);
    go(to);
  };
  const startFlow = (f) => { flowsOpen = false; tour = { flow: f.title, path: [f.start] }; glideTo(f.start); };
  const nav = (k) => {
    // With any card open the toggle closes them all (and they stay closed
    // on the next steps); with none open it opens every one.
    if (k === 'notes') { notesMode = scene().notes.some(noteOpen) ? 'hidden' : 'all'; flipped.clear(); render(); return; }
    if (k === 'end') { tour = null; flowsOpen = false; render(); return; }
    if (!tour) return;
    const c = choices(stepOf());
    if (k === 'back') { if (tour.path.length > 1) { tour.path.pop(); glideTo(stepOf()); } }
    else if (k === 'return') glideTo(stepOf());
    else if (k === 'next') { if (c.length === 1) go(c[0].to); }
    else if (typeof k === 'number' && c[k - 1]) go(c[k - 1].to);
    render();
  };
  const titleOf = (id) => (boards.has(id) ? boards.get(id).title.textContent : id);
  const button = (html, title, on) => {
    const el = document.createElement('button');
    el.innerHTML = html; el.title = title || '';
    if (on) el.onclick = on; else el.disabled = true;
    return el;
  };
  let tourKey = null;
  const tourUi = () => {
    const box = document.getElementById('tour'), list = document.getElementById('flows');
    const c = tour ? choices(stepOf()) : [];
    const key = tour ? JSON.stringify([tour, c]) : null;
    box.style.display = tour ? 'block' : 'none';
    list.style.display = !tour && flowsOpen ? 'block' : 'none';
    if (!tour && flowsOpen && !list.childElementCount) {
      for (const f of annot.flows) {
        list.append(button(`${esc(f.title)}${f.note ? `<small>${esc(f.note)}</small>` : ''}`, '', () => startFlow(f)));
      }
    }
    if (key === tourKey) return;
    tourKey = key; box.textContent = '';
    if (!tour) return;
    if (c.length > 1) {
      const picks = document.createElement('div'); picks.className = 'row picks';
      c.slice(0, 9).forEach((x, i) => picks.append(button(
        `${i + 1}&nbsp; ${x.name ? esc(x.name) + ' → ' : ''}${esc(titleOf(x.to))}`, '', () => nav(i + 1))));
      box.append(picks);
    }
    const row = document.createElement('div'); row.className = 'row';
    const where = document.createElement('div'); where.className = 'where';
    where.innerHTML = `<small>${tour.flow ? esc(tour.flow) + ' · ' : ''}Step ${tour.path.length}</small><b>${esc(titleOf(stepOf()))}</b>`;
    row.append(
      button('‹', 'Back (←)', tour.path.length > 1 ? () => nav('back') : null), where,
      button('›', 'Next (→)', c.length === 1 ? () => nav('next') : null));
    if (!c.length) { const end = document.createElement('small'); end.textContent = 'End of the flow'; row.append(end); }
    row.append(button('Return', 'Back to this step', () => nav('return')), button('×', 'End the tour (Esc)', () => nav('end')));
    box.append(row);
  };
  // Hotspot hints: every exit and link to another board on board `id`,
  // outlined for a moment.
  const hintsEl = document.getElementById('hints');
  let hints = null;
  const flash = (id) => {
    const b = boards.get(id);
    if (!b || (!b.exits.length && !b.links.length)) return;
    hints = id;
    hintsEl.classList.remove('on'); void hintsEl.offsetWidth; hintsEl.classList.add('on');
    render();
  };
  hintsEl.addEventListener('animationend', () => { hints = null; hintsEl.classList.remove('on'); hintsEl.textContent = ''; });

  // The side list on a tour: the step's ways on (as the tour bar's picks)
  // and its notes. Hover a row to find it on the board; click a way to
  // follow it, a note to open or close its card.
  const SIDE_W = 272;
  let sideKey = null, sideFolded = innerWidth < 700;
  const sideRoom = () => (tour && !sideFolded && innerWidth >= 700 ? SIDE_W + 16 : 0);
  const toggleNote = (n) => {
    if (!flipped.delete(n.n)) flipped.add(n.n);
    const el = inkByN.get(n.n);
    if (el && noteOpen(n)) {
      el.classList.remove('ping'); void el.offsetWidth; el.classList.add('ping');
      const x = cam.x + n.at[0] * cam.z, y = cam.y + n.at[1] * cam.z;
      if (x < 0 || y < 0 || x > innerWidth || y > innerHeight) glideTo(stepOf());
    }
    render();
  };
  const sideUi = (s) => {
    const side = document.getElementById('side');
    side.classList.toggle('on', !!tour);
    if (!tour) { sideKey = null; side.textContent = ''; return; }
    const step = stepOf(), c = choices(step), notes = s.notes.filter((n) => n.board === step);
    const key = JSON.stringify([step, c, notes.map((n) => [n.n, n.text, noteOpen(n)]), sideFolded]);
    if (key === sideKey) return;
    sideKey = key; side.textContent = '';
    side.classList.toggle('folded', sideFolded);
    for (const el of inkNotes) el.classList.remove('hot');
    const plural = (k, one) => `${k} ${one}${k === 1 ? '' : 's'}`;
    const head = document.createElement('header');
    head.innerHTML = `<div><b>This step</b><small>${[c.length ? plural(c.length, 'way') + ' on' : 'End of the flow',
      plural(notes.length, 'note')].join(' · ')}</small></div>`;
    head.append(button(sideFolded ? 'Show' : 'Hide', sideFolded ? 'Show the list' : 'Hide the list',
      () => { sideFolded = !sideFolded; render(); }));
    side.append(head);
    if (sideFolded) return;
    const body = document.createElement('div'); body.className = 'body';
    const h3 = (t) => { const h = document.createElement('h3'); h.textContent = t; body.append(h); };
    const none = (t) => { const p = document.createElement('p'); p.className = 'none'; p.textContent = t; body.append(p); };
    h3('Ways on');
    if (!c.length) none('Nothing leads on from here.');
    c.forEach((x, i) => {
      const row = button(`<span class="key">${i < 9 ? i + 1 : ''}</span><span class="t">${x.name ? esc(x.name) + ' → ' : ''}${esc(titleOf(x.to))}</span>`,
        'Go to ' + titleOf(x.to) + (i < 9 ? ` (${i + 1})` : ''), () => { hover = null; nav(i + 1); });
      const exit = s.arrows.find((a) => a.fromBoard === step && a.to === x.to && a.el);
      if (exit) {
        row.onmouseenter = () => { hover = { board: step, el: exit.el }; render(); };
        row.onmouseleave = () => { if (hover && hover.el === exit.el) { hover = null; render(); } };
      }
      body.append(row);
    });
    h3('Notes');
    if (!notes.length) none('No notes on this step.');
    for (const n of notes) {
      const row = button(`<span class="n">${n.n}</span><span class="t">${esc(n.text)}</span>`,
        noteOpen(n) ? 'Close this note' : 'Open this note', () => toggleNote(n));
      row.classList.toggle('open', noteOpen(n));
      row.onmouseenter = () => inkByN.get(n.n)?.classList.add('hot');
      row.onmouseleave = () => inkByN.get(n.n)?.classList.remove('hot');
      body.append(row);
    }
    side.append(body);
  };

  document.getElementById('notes-btn').onclick = () => nav('notes');
  document.getElementById('flows-btn').onclick = () => {
    flowsOpen = !flowsOpen;
    document.getElementById('flows').textContent = '';
    render();
  };

  const load = async () => {
    const data = await (await fetch('~canvas.json', { cache: 'no-store' })).json();
    const key = JSON.stringify(data);
    if (key !== layoutKey) { layoutKey = key; build(data); return true; }
    return false;
  };

  // Live: when a file changes, re-read the layout and reload the pages.
  const poll = async () => {
    try {
      const v = await (await fetch('~version', { cache: 'no-store' })).text();
      live.classList.remove('off');
      if (version !== null && v !== version) {
        if (!(await load())) for (const b of boards.values()) {
          try { b.frame.contentWindow.location.reload(); } catch (e) { b.frame.src = b.frame.src; }
        }
      }
      version = v;
    } catch (e) { live.classList.add('off'); }
    setTimeout(poll, 2000);
  };

  // The background: right-drag pans, wheel zooms; fingers pan and pinch.
  plane.addEventListener('pointerdown', (e) => {
    if (e.button === 2 && e.pointerType !== 'touch') { e.preventDefault(); startPan(e); }
  });
  addEventListener('pointermove', movePan);
  addEventListener('pointerup', (e) => { if (e.button === 2) endPan(); });
  addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('blur', () => { endPan(); fingers.clear(); pinch = null; });
  plane.addEventListener('wheel', (e) => { e.preventDefault(); wheel(e.clientX, e.clientY, e); }, { passive: false });
  plane.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') { touchMode(false); return; }
    touchMode(true);
    // A tap on a note marker opens its card; it is not a pan.
    if (e.target.closest && e.target.closest('.note')) return;
    plane.setPointerCapture(e.pointerId);
    fingerDown(e.pointerId, { x: e.clientX, y: e.clientY });
  });
  // On a tour, a click on empty canvas flashes what leads on from the step.
  plane.addEventListener('click', (e) => {
    if (!tour || document.body.classList.contains('touch') || (e.target.closest && e.target.closest('.note'))) return;
    flash(stepOf());
  });
  plane.addEventListener('pointermove', (e) => fingerMove(e.pointerId, { x: e.clientX, y: e.clientY }));
  const lift = (e) => fingerUp(e.pointerId);
  plane.addEventListener('pointerup', lift); plane.addEventListener('pointercancel', lift);

  // The viewer itself never scrolls or zooms natively (iOS pinch-zooms the
  // whole page otherwise); taps still click the bar.
  document.addEventListener('touchmove', (e) => {
    if (!(e.target.closest && e.target.closest('#side'))) e.preventDefault();
  }, { passive: false });
  gestures(window, (x, y) => ({ x, y }));
  document.getElementById('pad-btn').onclick = () => setTrackpad(!trackpad);
  padUi();
  touchMode(matchMedia('(pointer: coarse)').matches
    || (navigator.maxTouchPoints > 0 && !matchMedia('(any-pointer: fine)').matches));
  document.getElementById('fit').onclick = () => { moved = false; fit(); };
  document.getElementById('in').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
  document.getElementById('out').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
  addEventListener('keydown', (e) => {
    if (e.target !== document.body && e.target.tagName !== 'BUTTON') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight') nav('next');
    else if (e.key === 'ArrowLeft') nav('back');
    else if (e.key === 'Escape') nav('end');
    else if (e.key === 'n' || e.key === 'N') nav('notes');
    else if (e.key === 't' || e.key === 'T') setTrackpad(!trackpad);
    else if (/^[1-9]$/.test(e.key) && tour) nav(+e.key);
    else if (e.key === '0') { moved = false; fit(); }
    else if (e.key === '+' || e.key === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
    else if (e.key === '-') zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
  });
  addEventListener('resize', () => { if (!moved) fit(); });

  load().then(poll).catch(() => { live.classList.add('off'); setTimeout(() => location.reload(), 5000); });
})();
</script>
</body>
</html>
