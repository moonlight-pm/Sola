[package]
name = "sola-scope"
version.workspace = true
edition.workspace = true
description = "Pixel loupe — magnified grid under the pointer"

[[bin]]
name = "sola-scope"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
sola-call = { path = "../sola-call" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "svg", "canvas"] }
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
serde_json = "1"
base64 = { workspace = true }
