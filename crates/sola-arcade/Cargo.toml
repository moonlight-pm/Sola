[package]
name = "sola-arcade"
version = "0.1.0"
edition = "2024"

# Steam library browser + windowed-gamescope game launcher.
# Discovers installed titles from Steam's on-disk manifests; launches via
# `gamescope -W/-H -- steam -applaunch <id>` (never host -f).

[[bin]]
name = "sola-arcade"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "image"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
