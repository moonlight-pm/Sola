[package]
name = "sola-arcade"
version = "0.1.0"
edition = "2024"

# Steam library browser + windowed-gamescope game launcher.
# Discovers installed titles from Steam's on-disk manifests; launches via
# `gamescope -W/-H -- steam -applaunch <id>` (never host -f).

[[bin]]
name = "sola-arcade"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "image"] }
# Decode/downscale Steam library_hero banners off the UI thread so list rows
# paint immediately (iced's path handles load one-by-one on a worker).
image = { version = "0.25", default-features = true, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Nested X11 poke for live Fit (`GAMESCOPE_XWAYLAND_MODE_CONTROL`).
x11rb = "0.13"

[dev-dependencies]
tempfile = "3"
