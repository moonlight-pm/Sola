[package]
name = "sola-browser"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sola-browser"
path = "src/main.rs"

[dependencies]
sola-app = { path = "../sola-app" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
gtk4 = "0.9"
gdk4 = "0.9"
glib = "0.20"
gio = "0.20"
webkit6 = "0.4"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
