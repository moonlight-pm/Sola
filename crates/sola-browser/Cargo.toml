[package]
name = "sola-browser"
version = "0.1.0"
edition = "2024"

# Sola browser — iced chrome + CEF engine in one crate.
# Chrome (tabs, omnibox, session, profiles, vault) is engine-agnostic.
# CEF CPU OSR lives under `src/cef/`. WPE path retired after failed
# content-plane dogfood (see naturalethic/browser history).

[[bin]]
name = "sola-browser"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["vault"]
# The vault's client: the panel, page fill and passkeys, asking
# sola-vaultd on its socket. No Bitwarden SDK in the browser.
vault = [
    "dep:sola-vault-proto",
    "dep:zeroize",
    "dep:url",
    "dep:public-suffix",
    "dep:regex",
]

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "image", "canvas"] }
iced_futures = { version = "0.14", features = ["tokio"] }
sola-bus = { path = "../sola-bus" }
sola-call = { path = "../sola-call" }
sola-core = { path = "../sola-core" }
sola-kit = { path = "../sola-kit" }
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
base64 = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
# Use as Desktop Background: decode, crop, encode.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

# Shared sample pipeline (WGSL fullscreen triangle) for CEF CPU frames.
wgpu = { version = "27", features = ["vulkan-portability"] }

# CEF binding. Version pinned to match `cef-version` at workspace
# root — sola-make's `install-cef` reads the same file and downloads
# the matching binary distribution into `~/.cache/sola/cef-<ver>/`.
# Do NOT enable `accelerated_osr`.
cef = "156.3.0"

# The vault's socket protocol (types, requests, a blocking client).
sola-vault-proto = { path = "../sola-vault-proto", optional = true }
zeroize = { version = "1", optional = true }
url = { version = "2", optional = true }
# Page images for Use as Desktop Background.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Vault URI matching (which frames a fill reaches): the public suffix list
# passkey-rs ships, and the linear-time regex for stored patterns.
public-suffix = { git = "https://github.com/bitwarden/passkey-rs", rev = "043279e92e2eb5f509bf87eb7fa50987fd377e32", optional = true }
regex = { version = "1", optional = true }

[build-dependencies]
# No bindgen, no pkg-config — CEF is the only system dep and it
# comes in pre-built via sola-make.
