[package]
name = "sola-browser"
version = "0.1.0"
edition = "2024"

# Sola browser — WPE WebKit + iced chrome in one crate.
# CEF parallel engine removed (git tag `pre-cef-removal`).

[[bin]]
name = "sola-browser"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland"] }
iced_futures = { version = "0.14", features = ["tokio"] }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
sola-kit = { path = "../sola-kit" }
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }

# DMA-BUF import via wgpu-hal-patched (workspace `[patch.crates-io]`).
wgpu = { version = "27", features = ["vulkan-portability"] }
wgpu-hal = { version = "27", features = ["vulkan"] }
ash = "0.38"
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"
bindgen = "0.72"
cc = "1"
