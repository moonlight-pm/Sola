[package]
name = "sola-kit"
version = "0.1.0"
edition = "2024"

# Iced-based Sola app kit. Successor to the CEF/Remix-v3 kit
# (now `sola-kit-legacy`). Provides:
#   - app scaffolding (`sola_kit::run::<A>()` — bus, fonts, window,
#     theme wired up so apps don't repeat boilerplate)
#   - the canonical sola palette as an `iced::Theme`
#   - shared font constants + loading helper
#   - reusable iced widgets / styles under `sola_kit::components`
#
# Library + the storybook binary. Consumed by sola-monitor,
# sola-settings, sola-shell, and the browser crates.

[lib]
# default — uses src/lib.rs

# Storybook binary. Each kit-shipped component gets a showcase page so
# the kit itself is dogfooded — every regression shows up here first.
# Apps consume the kit by path-depending on it; the storybook is just
# another iced consumer that happens to live in-tree.
[[bin]]
name = "sola-kit"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "svg", "advanced"] }
# Reaches iced's global font system to register system fonts (iced's
# own `FontSystem` is built via cosmic-text's `new_with_fonts`, which
# does NOT load system fonts — so `Font::with_name` can't resolve any
# installed family unless we load them ourselves). Same 0.14 release
# iced pulls in, so there's one shared global font db.
iced_graphics = "0.14"
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
sola-assets = { path = "../sola-assets" }
serde_json = "1"
tracing = "0.1"
# System font enumeration for the font picker (matches the version
# cosmic-text already pulls in, so no extra build cost).
fontdb = "0.23"
