[package]
name = "sola-kit"
version = "0.1.0"
edition = "2024"

# Iced-based Sola app kit. Successor to the now-removed CEF/Remix-v3
# kit. Provides:
#   - app scaffolding (`startup` + `BusSetup` + app-owned iced
#     builder — bus, fonts, window, theme helpers so apps don't
#     repeat boilerplate; no generic `run::<A>()` wrapper)
#   - the canonical sola palette as an `iced::Theme` (live bus theme
#     via `Topic::Theme` / `theme_from_bus`; `default_theme` offline)
#   - shared font constants + loading helper
#   - reusable iced widgets / styles under `sola_kit::components`
#
# Library + the storybook binary. Consumed by sola-monitor,
# sola-settings, sola-shell, sola-terminal, agent, browser-core,
# and the in-tree storybook.

[lib]
# default — uses src/lib.rs

# Storybook binary. Each kit-shipped component gets a showcase page so
# the kit itself is dogfooded — every regression shows up here first.
# Apps consume the kit by path-depending on it; the storybook is just
# another iced consumer that happens to live in-tree.
[[bin]]
name = "sola-kit"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "svg", "image", "advanced", "canvas"] }
# Direct dep so the kit's forked text-input widget (components/kit_input/) can
# use iced's core widget machinery exactly as iced_widget does internally — the
# vendored source was written against `iced_core` (iced_widget aliases it as
# `crate::core`). Same 0.14 release iced pulls in, so types are identical and
# Cargo dedups.
iced_core = "0.14"
# Grapheme-cluster iteration for the forked text-input widget (cursor.rs /
# value.rs), the same crate iced_widget uses for it.
unicode-segmentation = "1"
# Reaches iced's global font system to register system fonts (iced's
# own `FontSystem` is built via cosmic-text's `new_with_fonts`, which
# does NOT load system fonts — so `Font::with_name` can't resolve any
# installed family unless we load them ourselves). Same 0.14 release
# iced pulls in, so there's one shared global font db.
iced_graphics = "0.14"
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
sola-assets = { path = "../sola-assets" }
serde_json = "1"
tracing = "0.1"
# System font enumeration for the font picker (matches the version
# cosmic-text already pulls in, so no extra build cost).
fontdb = "0.23"
# TTF/OTF face parser — read the active mono font's real advance/line
# metrics so consumers (sola-terminal) can size a cell box from the
# actual font, not a hardcoded JetBrains Mono ratio. Pure-Rust, already
# in the tree transitively via cosmic-text.
ttf-parser = "0.25"
