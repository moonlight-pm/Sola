[package]
name = "sola-make"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# CEF download + extract is shelled out to `curl | tar -xj` (see
# crates/sola-make/src/cef.rs::download_and_extract). This drops
# `ureq`/`ring`/`rustls`/`bzip2`/`tar` from the workspace dep graph,
# which avoids cargo recompiling them every time we alternate between
# `cargo build -p sola-kit-legacy` and `cargo make build sola-kit-legacy` (those
# crates were shared with cef-dll-sys's `download-cef` build-dep at
# different feature unifications, causing perpetual cascade).
