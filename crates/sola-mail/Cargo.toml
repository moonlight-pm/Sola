[package]
name = "sola-mail"
version.workspace = true
edition.workspace = true
description = "Kit-native mail client (IMAP/SMTP) for Sola"

[[bin]]
name = "sola-mail"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }

iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
tokio = { version = "1", default-features = false, features = ["time"] }

imap = { workspace = true }
imap-proto = "0.10"
rustls = { workspace = true }
rustls-connector = { workspace = true }
lettre = { workspace = true }
mail-parser = { workspace = true }
ureq = { workspace = true }
base64 = { workspace = true }
html2text = { workspace = true }
