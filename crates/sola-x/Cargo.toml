[package]
name = "sola-x"
version.workspace = true
edition.workspace = true

[dependencies]
# Smithay — minimal features for XWayland hosting (no GPU/DRM/input backends).
smithay = { version = "0.7.0", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "xwayland",
] }

# Wayland client for connecting to sola-compositor.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# Bus client for lifecycle coordination.
sola-bus = { path = "../sola-bus" }

calloop = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
libc = "0.2"
