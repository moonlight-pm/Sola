[package]
name = "sola-shell"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sola-shell"
path = "src/main.rs"

[dependencies]
# Shell still rides the mothballed kit until it's ported to the new
# iced sola-kit; depend via the package rename so `use sola_kit::…`
# stays unchanged internally.
sola-kit = { path = "../../crates/sola-kit-legacy", package = "sola-kit-legacy" }
sola-bus = { path = "../../crates/sola-bus" }
sola-core = { path = "../../crates/sola-core" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
