[package]
name = "sola-shell"
version = "0.1.0"
edition = "2024"

# Iced-native sola desktop shell. Successor to the CEF/Remix v3 shell
# (now `sola-shell-legacy`). Four-window shell: menubar, launcher,
# switcher, menu.

[[bin]]
name = "sola-shell"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "svg", "canvas", "image", "advanced"] }
png = "0.18"
sola-bus = { path = "../sola-bus" }
sola-call = { path = "../sola-call" }
sola-core = { path = "../sola-core" }
sola-kit = { path = "../sola-kit" }
sola-assets = { path = "../sola-assets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "net"] }
nix = { version = "0.31", features = ["net"] }
nvml-wrapper = "0.10"
# System-bus BlueZ (Adapter1 / Device1 / Battery1 / Agent1). In-process,
# same idea as stats sampling — no bluetoothctl, no extra daemon.
zbus = "5"
