# Empty [workspace] table — this crate is its own workspace, NOT a member
# of any parent workspace. Required so cargo's workspace-walk stops here
# when this crate is built inside a `.worktrees/<branch>/` subtree of
# another workspace; without it, cargo would bind to the outer (master)
# workspace whose `exclude` paths don't match the worktree's manifest
# location. Harmless on master where the parent excludes this crate
# anyway.
[workspace]

[package]
name = "sola-shell"
version = "0.1.0"
edition = "2024"

# Iced-native sola desktop shell. Successor to the CEF/Remix v3 shell
# (now `sola-shell-legacy`). Four-window shell: menubar, launcher,
# switcher, menu. Workspace-excluded because iced's transitive
# smithay-clipboard flips wayland-sys into dlopen mode which would
# unify across the workspace and break sola-river's direct wayland
# linkage.

[[bin]]
name = "sola-shell"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "svg"] }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
sola-kit = { path = "../sola-kit" }
sola-assets = { path = "../sola-assets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["time"] }
