[package]
name = "sola-shell"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sola-shell"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../../crates/sola-kit" }
sola-bus = { path = "../../crates/sola-bus" }
sola-core = { path = "../../crates/sola-core" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
