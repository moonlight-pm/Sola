[package]
name = "sola-call"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sola-call"
path = "src/main.rs"

[dependencies]
sola-core = { path = "../sola-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3"
