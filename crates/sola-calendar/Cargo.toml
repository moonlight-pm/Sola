[package]
name = "sola-calendar"
version.workspace = true
edition.workspace = true
description = "Kit-native calendar (local, Google Calendar, iCloud CalDAV) for Sola"
license = "MIT"

[[bin]]
name = "sola-calendar"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }

iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "svg"] }

anyhow = "1"
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rustls = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1"
urlencoding = "2"
url = "2"
