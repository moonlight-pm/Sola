[package]
name = "sola-settings"
version = "0.1.0"
edition = "2024"

# iced-based settings panel. Consumes `sola-kit` for shared app
# scaffolding, fonts, theme wiring, and reusable components.

[[bin]]
name = "sola-settings"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland"] }
tracing = "0.1"
