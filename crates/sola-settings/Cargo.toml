[package]
name = "sola-settings"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sola-settings"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
include_dir = "0.7"
