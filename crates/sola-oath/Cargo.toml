[package]
name = "sola-oath"
version.workspace = true
edition.workspace = true

# The Oath catalog app: packages, their needs, pins and apply, over
# `oath --json`. The shell lists it only on Oath.

[[bin]]
name = "sola-oath"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
