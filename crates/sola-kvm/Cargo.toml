[package]
name = "sola-kvm"
version.workspace = true
edition.workspace = true
description = "Sola-native software KVM — novus (server) captures input and sprays UDP to ember (macOS client)"

[[bin]]
name = "sola-kvm"
path = "src/main.rs"

[dependencies]
sola-core = { path = "../sola-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = { workspace = true }
tracing = "0.1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
