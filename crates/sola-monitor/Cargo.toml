[package]
name = "sola-monitor"
version = "0.1.0"
edition = "2024"

# iced-based system monitor / bus inspector. Consumes `sola-kit` for
# shared app scaffolding, fonts, theme wiring, and reusable components.

[[bin]]
name = "sola-monitor"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland"] }
serde_json = "1"
tracing = "0.1"
