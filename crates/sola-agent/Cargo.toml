[package]
name = "sola-agent"
version.workspace = true
edition.workspace = true

# Desktop ACP client for coding agents (default backend: Grok Build).
# Kit-native iced UI; agent process owns tools, sessions, and model.

[[bin]]
name = "sola-agent"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
