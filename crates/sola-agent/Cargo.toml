[package]
name = "sola-agent"
version.workspace = true
edition.workspace = true

# Minimal iced-based AI agent shell. This intentionally starts from the
# current sola-kit app pattern (see sola-terminal / sola-settings), not the
# retired WebView prototype under apocrypha/apps/agent.

[[bin]]
name = "sola-agent"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { workspace = true, features = ["json"] }
rustls = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
