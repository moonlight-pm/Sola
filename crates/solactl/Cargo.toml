[package]
name = "solactl"
version.workspace = true
edition.workspace = true

[[bin]]
name = "solactl"
path = "src/main.rs"

[dependencies]
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# Session-bus MPRIS control for `solactl media` (play/pause, next, prev).
# Blocking API only — solactl is a short-lived one-shot CLI, no async runtime.
zbus = "5"
