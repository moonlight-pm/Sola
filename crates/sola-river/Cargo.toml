[package]
name = "sola-river"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sola-river"
path = "src/main.rs"

[dependencies]
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
tracing = "0.1"
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
# Cursor-shape (wp-cursor-shape-v1) for move/resize cursor feedback. The
# cursor_shape module is gated behind staging+unstable (it references the
# tablet zv2 interface).
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
thiserror = "2"
bitflags = "2"
rustix = { version = "1", features = ["fs"] }
