[package]
name = "sola-open"
version.workspace = true
edition.workspace = true
description = "Opening links and files: the handlers Sola keeps, and xdg-open"

[[bin]]
name = "xdg-open"
path = "src/main.rs"

[dependencies]
sola-core = { path = "../sola-core" }
sola-bus = { path = "../sola-bus" }
sola-call = { path = "../sola-call" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
