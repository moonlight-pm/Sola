<!--
  Chrome structure. Edit this file; the spike hot-reloads on mtime.
  data-template="row" is cloned once per store leaf (not shown itself).
  data-slot="rows" is where those clones go.
  data-bind fills text from the store: title, query, label.
  Rust still adds live classes (is-active, is-header, is-focused, is-dragging).
-->
<div class="app">
  <aside class="sidebar">
    <div class="strip" data-slot="strip">
      <div class="leaves" data-slot="rows">
        <div class="row" data-template="row" data-id="" data-kind="item">
          <div class="etch">
            <div class="label" data-bind="label"></div>
          </div>
        </div>
      </div>
    </div>
  </aside>
  <main class="stage">
    <div class="stage-title" data-bind="title"></div>
    <div class="field">
      <div class="field-label">Filter</div>
      <div class="input" data-input="q" data-bind="query"></div>
    </div>
    <div class="surface" data-surface="demo"></div>
  </main>
</div>
