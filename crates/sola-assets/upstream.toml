# Pinned upstream sources for third-party asset packs.
#
# SF Pro (Apple system font) — NOT synced here.  The TTFs are Apple-licensed
# and cannot be redistributed.  Place them manually:
#
#   mkdir -p /opt/sola/share/fonts/SFPro
#   cp assets/fonts/SF-Pro.ttf assets/fonts/SF-Pro-Italic.ttf \
#      assets/fonts/SF-Compact.ttf assets/fonts/SF-Compact-Italic.ttf \
#      /opt/sola/share/fonts/SFPro/
#
# The kit registers them via FONT_FILES in crates/sola-kit/src/fonts.rs.
# Missing files log a warning at startup and fall back to Inter.
#
# `cargo make assets sync` reconciles /opt/sola/share/<category>/<name>/
# with this file: pulls missing or out-of-date packs, skips packs already
# on the declared pin, and removes pack directories no longer listed
# here. Nothing is committed; `cargo make install` auto-syncs on a fresh
# checkout. For github packs with empty `rev` (tracking the default
# branch), pass `--refresh` to re-resolve HEAD.
#
# Sources:
# - `github:<owner>/<repo>` — git clone (honors `rev`).
# - `nix-pkg:<attr>` — `nix-build '<nixos>' -A <attr>`; uses the resulting
#   store path. Pinned by the system's nixpkgs channel (no `rev`).
#
# Leave `rev` empty to track the default branch; set to a tag or commit SHA
# to pin.

[packs.lucide]
source   = "github:lucide-icons/lucide"
rev      = ""
src_dir  = "icons"
category = "icons"

[packs.simpleicons]
source   = "github:simple-icons/simple-icons"
rev      = ""
src_dir  = "icons"
category = "icons"

# McMojave cursor theme — macOS-style cursors. Chosen over Adwaita
# because Adwaita's wlroots-cursor-shape lookups silently fell back to
# default for everything except `text` and `pointer` (see
# docs/manual/cursor-theme-loading.md). McMojave ships a flat `dist/`
# tree with all 12 resize variants and a clean `index.theme` (no
# `Inherits=` chain to break the lookup). Pinned by SHA because the
# repo has no release tags. License: GPL-3.0.
[packs.McMojave]
source   = "github:vinceliuice/McMojave-cursors"
rev      = "7d0bfc1f91028191cdc220b87fd335a235ee4439"
src_dir  = "dist/cursors"
category = "cursors"
kind     = "cursors"

# Inter — open-source UI font that closely matches Apple's San Francisco
# (which is license-restricted to Apple platforms). Variable TTF covers
# all weights/italics in two files. License: SIL OFL 1.1.
#
# Fetched from nixpkgs because the upstream rsms/inter repo only ships
# WOFF/WOFF2 in its git tree — cosmic-text (iced's text shaper) needs
# TTF/OTF, so we pull the nixpkgs-built TTF derivation.
[packs.Inter]
source   = "nix-pkg:inter"
src_dir  = "share/fonts/truetype"
category = "fonts"
kind     = "fonts"
files    = ["InterVariable.ttf", "InterVariable-Italic.ttf"]

# JetBrains Mono — mono UI font used by sola-monitor for row
# bodies and JSON. Pinned SHA: the repo has releases but pulling the
# default branch's HEAD is fine for an exploratory preview.
# License: SIL OFL 1.1.
[packs.JetBrainsMono]
source   = "github:JetBrains/JetBrainsMono"
rev      = "19371302b95d218af43299bce79ddbddd0bc364d"
src_dir  = "fonts/ttf"
category = "fonts"
kind     = "fonts"
files    = ["JetBrainsMono-Regular.ttf"]

# Roboto Flex — variable Roboto with opsz/slnt/wdth/wght axes; used by
# sola-monitor for topic/source cells, sticky title, and text
# inputs. Variable font keeps us at a single ~1.8 MB TTF that covers
# every weight we'll want during evaluation. License: SIL OFL 1.1.
[packs.RobotoFlex]
source   = "github:googlefonts/roboto-flex"
rev      = "739e06dc46ebb14cddd88b9768a6c1504d4677f6"
src_dir  = "fonts"
category = "fonts"
kind     = "fonts"
files = [
  { from = "RobotoFlex[GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC,opsz,slnt,wdth,wght].ttf", to = "RobotoFlex.ttf" },
]

# Roboto Condensed — the classic static Roboto Condensed Regular. Used
# by sola-monitor for column headers and widget text (buttons,
# selects). Sourced from nixpkgs because the modern font lives in
# github:google/fonts which is too large to clone fully and sparse
# clones of font files inside it are fragile. License: Apache-2.0.
[packs.RobotoCondensed]
source   = "nix-pkg:roboto"
src_dir  = "share/fonts/truetype"
category = "fonts"
kind     = "fonts"
files    = ["RobotoCondensed-Regular.ttf", "RobotoCondensed-Bold.ttf"]

# Iosevka Term Slab (Nerd Font Mono variant) — the terminal font.
# Sourced from nixpkgs because upstream release zips bundle every
# weight/width permutation (~240 MB); the nixpkgs derivation ships only
# the four core styles we need. The source TTFs are ~13 MB each, and the
# converted WOFF2s ship to /opt/sola/share/fonts/IosevkaTermSlab/.
# License: SIL OFL 1.1.
[packs.IosevkaTermSlab]
source   = "nix-pkg:nerd-fonts.iosevka-term-slab"
src_dir  = "share/fonts/truetype/NerdFonts/IosevkaTermSlab"
category = "fonts"
kind     = "fonts"
files = [
  { from = "IosevkaTermSlabNerdFontMono-Regular.ttf",    to = "IosevkaTermSlab-Regular.woff2",    transform = "ttf-to-woff2" },
  { from = "IosevkaTermSlabNerdFontMono-Italic.ttf",     to = "IosevkaTermSlab-Italic.woff2",     transform = "ttf-to-woff2" },
  { from = "IosevkaTermSlabNerdFontMono-Bold.ttf",       to = "IosevkaTermSlab-Bold.woff2",       transform = "ttf-to-woff2" },
  { from = "IosevkaTermSlabNerdFontMono-BoldItalic.ttf", to = "IosevkaTermSlab-BoldItalic.woff2", transform = "ttf-to-woff2" },
]
