[package]
name = "sola-vault-proto"
version.workspace = true
edition.workspace = true
description = "The vault's socket protocol: types, requests, and a blocking client (no Bitwarden SDK)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
hmac = "0.12"
sha1 = "0.10"
