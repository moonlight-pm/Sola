# HTML/CSS kit — sctk window, no winit.
# Storybook: sola-kit-spike. Lab twins: sola-settings-lab, sola-monitor-lab.
# Do not install; run from crate / workspace target/.
[package]
name = "sola-kit-spike"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sola-kit-spike"
path = "src/main.rs"

[[bin]]
name = "sola-settings-lab"
path = "src/bin/settings.rs"

[[bin]]
name = "sola-monitor-lab"
path = "src/bin/monitor.rs"

[dependencies]
cosmic-text = "0.15"
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
smithay-client-toolkit = "0.20"
wayland-client = { version = "0.31", features = ["system"] }
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
sola-bus = { path = "../sola-bus" }
sola-call = { path = "../sola-call" }
sola-core = { path = "../sola-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
