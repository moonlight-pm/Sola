# Isolated from the Sola workspace (wgpu 26 vs iced wgpu 27).
# HTML/CSS kit spike — sctk window, no winit, no install, no merge.
[workspace]
members = ["."]
resolver = "3"

[package]
name = "sola-kit-spike"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "sola-kit-spike"
path = "src/main.rs"

[dependencies]
cosmic-text = "0.15"
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"
wgpu = { version = "26", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
smithay-client-toolkit = "0.19"
wayland-client = { version = "0.31", features = ["system"] }
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"
