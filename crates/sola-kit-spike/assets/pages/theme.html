<div class="demo-stack wide">
  <div class="t-sub">Fonts</div>
  <div class="form-row">
    <div class="form-key">ui</div>
    <div class="t-body">SF Pro Text</div>
  </div>
  <div class="form-row">
    <div class="form-key">ui_medium</div>
    <div class="t-body">SF Pro Text</div>
  </div>
  <div class="form-row">
    <div class="form-key">display</div>
    <div class="t-body">SF Pro Text</div>
  </div>
  <div class="form-row">
    <div class="form-key">chrome</div>
    <div class="t-body">SF Pro Text</div>
  </div>
  <div class="form-row">
    <div class="form-key">mono</div>
    <div class="t-body">Iosevka Term Slab</div>
  </div>
  <div class="t-sub">Palette</div>
  <div class="card-body">Click a swatch after New Theme. Neon stays neon — don't mix it toward black.</div>
  <div class="t-caption" data-bind="status"></div>
  <div class="seed-row">
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="bg"></div>
      <div class="atom-name">BG</div>
    </div>
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="raised"></div>
      <div class="atom-name">BG_RAISED</div>
    </div>
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="hover"></div>
      <div class="atom-name">BG_HOVER</div>
    </div>
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="hairline"></div>
      <div class="atom-name">BORDER</div>
    </div>
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="fg"></div>
      <div class="atom-name">FG</div>
    </div>
  </div>
  <div class="seed-row">
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="muted"></div>
      <div class="atom-name">FG_MUTED</div>
    </div>
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="accent"></div>
      <div class="atom-name">ACCENT</div>
    </div>
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="success"></div>
      <div class="atom-name">SUCCESS</div>
    </div>
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="warning"></div>
      <div class="atom-name">WARNING</div>
    </div>
    <div class="atom">
      <div class="swatch-lg" data-action="edit-atom" data-id="danger"></div>
      <div class="atom-name">DANGER</div>
    </div>
  </div>
  <div class="card" data-slot="atom-picker">
    <div class="card-body">Editing atom. Drag or type.</div>
    <div class="sv-square" data-action="sv"></div>
    <div class="hue-rail" data-action="hue"></div>
    <div class="alpha-rail" data-action="alpha"></div>
    <div class="form-row">
      <div class="form-key">Hex</div>
      <div class="input" data-action="focus" data-id="hex" data-bind="hex"></div>
    </div>
  </div>
</div>
