<div class="demo-stack">
  <div class="card">
    <div class="card-title">Preferences</div>
    <div class="card-body">Label left, control right. Height 32. Parent owns state.</div>
    <div class="form-row">
      <div class="form-key">Wi-Fi</div>
      <div class="form-val">
        <div class="toggle" data-action="toggle" data-id="wifi"><div class="knob"></div></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-key">Bluetooth</div>
      <div class="form-val">
        <div class="toggle" data-action="toggle" data-id="bt"><div class="knob"></div></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-key">Launch at login</div>
      <div class="form-val">
        <div class="check" data-action="toggle" data-id="login">
          <div class="icon" data-kind="icon" data-id="lucide/check"></div>
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-key">Notifications</div>
      <div class="form-val">
        <div class="check" data-action="toggle" data-id="notify">
          <div class="icon" data-kind="icon" data-id="lucide/check"></div>
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-key">Share anonymous analytics</div>
      <div class="form-val">
        <div class="check" data-action="toggle" data-id="analytics">
          <div class="icon" data-kind="icon" data-id="lucide/check"></div>
        </div>
      </div>
    </div>
    <div class="help">Stacked label + input lives on Field.</div>
  </div>
</div>
