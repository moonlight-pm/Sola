<div class="demo-stack">
  <div class="card">
    <div class="toolbar">
      <div class="tool" data-action="note" data-id="Pause">Pause</div>
      <div class="tool" data-action="note" data-id="Clear">Clear</div>
      <div class="tool" data-action="note" data-id="Reset">Reset</div>
    </div>
    <div class="row-inline">
      <div data-action="note" data-id="Compose">
        <div class="icon icon-18" data-kind="icon" data-id="lucide/square-pen"></div>
      </div>
      <div data-action="note" data-id="Reply">
        <div class="icon icon-18" data-kind="icon" data-id="lucide/reply"></div>
      </div>
      <div class="icon icon-18" data-kind="icon" data-id="lucide/archive"></div>
    </div>
    <div class="t-caption wrap" data-bind="status">Compact actions for a top strip. Icons with a delayed tooltip on iced; click records here.</div>
  </div>
</div>
