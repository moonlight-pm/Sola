<div class="demo-stack">
  <div class="card">
    <div class="card-title">Account</div>
    <div class="card-body">Click a well and type. Tab cycles. Escape blurs. Error replaces help in the same slot.</div>
    <div class="stack-field">
      <div class="stack-label">Username</div>
      <div class="input" data-action="focus" data-id="user" data-bind="user"></div>
      <div class="help">3–20 characters</div>
    </div>
    <div class="stack-field">
      <div class="stack-label">Email</div>
      <div class="input" data-action="focus" data-id="email" data-bind="email"></div>
    </div>
    <div class="stack-field">
      <div class="stack-label">Display name</div>
      <div class="input" data-action="focus" data-id="display" data-bind="display"></div>
      <div class="help-danger">This field is required</div>
    </div>
    <div class="help">Shown in the menubar. Caret blinks while focused.</div>
  </div>
</div>
