<div class="demo-stack wide">
  <div class="card-body">Select a row. Hover × closes it. Work is a collapsible group. Status marks stay on the rail as a visual sample.</div>
  <div class="side-demo">
    <div class="side-panel" data-slot="side-rows" data-id="side-scroll"></div>
    <div class="side-fill">
      <div class="t-muted">List etch. Hover-only ×. Collapse Work.</div>
      <div class="row-inline">
        <div class="mark" data-kind="mark" data-id="working"></div>
        <div class="t-body">working</div>
      </div>
      <div class="row-inline">
        <div class="mark" data-kind="mark" data-id="waiting"></div>
        <div class="t-body">waiting</div>
      </div>
      <div class="row-inline">
        <div class="mark" data-kind="mark" data-id="done"></div>
        <div class="t-body">done</div>
      </div>
      <div class="row-inline">
        <div class="mark" data-kind="mark" data-id="idle"></div>
        <div class="t-body">idle</div>
      </div>
    </div>
  </div>
  <div class="t-caption" data-bind="status"></div>
</div>
