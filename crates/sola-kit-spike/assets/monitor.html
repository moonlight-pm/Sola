<!-- Monitor (lab). Body row: nav | log column (toolbar + log + inspector) | last-known rail to the top. -->
<div class="app">
  <div data-slot="titlebar"></div>
  <div class="body">
    <div data-slot="sidebar"></div>
    <div class="monitor-stage">
      <div data-slot="toolbar"></div>
      <div class="monitor-main" data-id="monitor-main">
        <div class="log" data-id="monitor-log">
          <div class="log-head" data-id="log-head" data-slot="log-head">
            <div class="t-caption col-time">Time</div>
            <div class="t-caption col-topic">Topic</div>
            <div class="t-caption col-source">Source</div>
            <div class="t-caption col-payload">Payload</div>
          </div>
          <div class="log-body" data-id="log-scroll" data-slot="log-rows"></div>
        </div>
        <div data-slot="split-h"></div>
        <div class="inspect" data-id="inspect-pane">
          <div data-slot="inspect-head"></div>
          <div class="inspect-body" data-id="inspect-scroll" data-slot="inspect-body"></div>
        </div>
      </div>
    </div>
    <div data-slot="split-v"></div>
    <div class="rail" data-id="rail-pane">
      <div data-slot="rail"></div>
    </div>
  </div>
</div>
