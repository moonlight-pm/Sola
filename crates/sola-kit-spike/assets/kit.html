<!--
  Kit spike storybook chrome. Edit this file; the process reloads on mtime.
  data-slot="sidebar" is replaced by components::sidebar.
  data-bind fills title / heading / lede / theme.
-->
<div class="app">
  <div data-slot="titlebar"></div>
  <div class="sb-header">
    <div class="select select-lg" data-action="theme-toggle">
      <div class="enamel" data-id="header-enamel"></div>
      <div class="select-label" data-bind="theme"></div>
      <div class="icon chevron" data-kind="icon" data-id="lucide/chevron-down"></div>
      <div class="menu menu-hang" data-slot="theme-menu">
        <div class="menu-item" data-action="theme-pick" data-id="Default">Default</div>
        <div class="menu-item" data-action="theme-pick" data-id="Graphite">Graphite</div>
        <div class="menu-item" data-action="theme-pick" data-id="Night">Night</div>
      </div>
    </div>
    <div class="btn btn-sm btn-secondary" data-action="theme-new">New Theme</div>
    <div class="btn btn-sm btn-danger-outline" data-action="theme-delete">Delete</div>
  </div>
  <div class="body">
    <div data-slot="sidebar"></div>
    <main class="stage" data-id="stage-scroll">
      <div class="heading" data-bind="heading"></div>
      <div class="lede" data-bind="lede"></div>
      <div class="demo" data-slot="demo"></div>
      <div class="atom-panel" data-slot="atoms"></div>
    </main>
  </div>
</div>
