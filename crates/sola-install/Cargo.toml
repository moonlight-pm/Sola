[package]
name = "sola-install"
version = "0.1.0"
edition = "2024"

# Sola installer wizard — kit UI for the product ISO path.
# Dogfood under an existing session: `cargo make build sola-install`
# then run `target/debug/sola-install` (or install with permission).

[[bin]]
name = "sola-install"
path = "src/main.rs"

[dependencies]
sola-kit = { path = "../sola-kit" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland", "svg"] }
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
