[package]
name = "sola-browser-cef"
version = "0.1.0"
edition = "2024"

# **PARALLEL IMPLEMENTATION — maintained at feature parity with
# sola-browser-wpe.** sola-browser-wpe is the primary engine
# (benchmark in docs/notes/2026-05-21-wpe-vs-cef-bench.md picked
# WPE on NVIDIA: CEF can't use on_accelerated_paint there → ~70 %
# more CPU per frame + 400-700 MiB more RSS). CEF stays alive in
# case the host hardware moves to Mesa, where the comparison
# would need redoing, and as a sanity check that our shader/iced
# integration isn't WPE-specific.
#
# **Workflow:** when a feature lands in sola-browser-wpe, the
# equivalent port should follow here before considering the
# feature "done".
#
# CEF uses CPU OSR (`on_paint` BGRA → `queue.write_texture`). There is
# no dma-buf path on this host; do not enable the `accelerated_osr`
# feature on the `cef` crate.

[[bin]]
name = "sola-browser-cef"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland"] }
sola-browser-core = { path = "../sola-browser-core" }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
sola-kit = { path = "../sola-kit" }
tracing = "0.1"

wgpu = { version = "27", features = ["vulkan-portability"] }

# CEF binding. Version pinned to match `cef-version` at workspace
# root — sola-make's `install-cef` reads the same file and downloads
# the matching binary distribution into `~/.cache/sola/cef-<ver>/`.
# Do NOT enable `accelerated_osr`.
cef = "147.1.0"

[build-dependencies]
# No bindgen, no pkg-config — CEF is the only system dep and it
# comes in pre-built via sola-make.
