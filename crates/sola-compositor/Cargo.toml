[package]
name = "sola-compositor"
version.workspace = true
edition.workspace = true

[dependencies]
# Smithay — the Rust Wayland compositor framework.
# We disable defaults and enable only the backends we need.
# See: https://docs.rs/smithay/0.7.0
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",              # DRM/KMS for direct display output
    "backend_gbm",              # GBM buffer allocation (GPU memory)
    "backend_egl",              # EGL context creation for OpenGL
    "backend_libinput",         # Input device handling (keyboard, mouse, touch)
    "backend_udev",             # Device discovery and hotplug monitoring
    "backend_session_libseat",  # Session management (TTY access without root)
    "renderer_gl",              # OpenGL ES renderer
    "renderer_multi",           # Multi-GPU renderer support
    "wayland_frontend",         # Wayland protocol server implementation
    "desktop",                  # Desktop helpers (Space, window management)
    "xwayland",                 # XWayland support for X11 apps (Steam, etc.)
] }

# Connector scanning helpers for Smithay's DRM backend.
# display-info feature disabled: requires libdisplay-info < 0.3.0
# but system has 0.3.0. EDID parsing is not needed for Phase 1.
smithay-drm-extras = { version = "0.1.0", default-features = false }

# DRM pixel format constants (Argb8888, etc.).
drm-fourcc = "2.2"

tracing = "0.1"
thiserror = "2"
xcursor = "0.3"

[dev-dependencies]
tempfile = "3"
