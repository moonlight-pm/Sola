[package]
name = "sola-browser-core"
version = "0.1.0"
edition = "2024"

# Shared iced chrome for sola-browser. Generic over the `Engine` trait so
# the WPE engine body lives in `sola-browser` and chrome stays free of
# libWPEWebKit.

[lib]
path = "src/lib.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "wayland"] }
iced_futures = { version = "0.14", features = ["tokio"] }
sola-bus = { path = "../sola-bus" }
sola-core = { path = "../sola-core" }
sola-kit = { path = "../sola-kit" }
tracing = "0.1"
# Shared sample pipeline (WGSL fullscreen triangle) lives in core so
# both engines use one implementation.
wgpu = { version = "27", features = ["vulkan-portability"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
