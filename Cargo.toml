[workspace]
members = ["crates/*"]
# `wgpu-hal-patched` is a vendored wgpu-hal 27.0.4 with
# `VK_EXT_image_drm_format_modifier` enabled; pulled in workspace-wide
# via `[patch.crates-io]` below. Excluded as a member so cargo doesn't
# try to compile it as a standalone target.
#
# Iced/wgpu/WPE feature unification across the rest of the workspace
# is OK because `.cargo/config.toml` bakes `/run/current-system/sw/lib`
# into every binary's RUNPATH, so sola-river's runtime dlopen of
# libwayland-client finds the system lib. WPEWebKit is staged at
# `/opt/sola/nix/wpewebkit/` and pulled into `environment.systemPackages`
# via configuration.nix, so sola-browser's pkg-config probes
# (wpe-webkit-2.0, wpe-platform-2.0, …) resolve system-wide.
exclude = [
    "crates/wgpu-hal-patched",
    # Blitz/dioxus-native pulls wgpu 26. The workspace patches wgpu-hal to
    # 27.0.4 for iced — keep this crate out of the member graph so the
    # two do not unify. Built only via `cargo make build sola-blitz-spike`.
    "crates/sola-blitz-spike",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
base64 = "0.22"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde_yaml_ng = "0.10"
toml = "0.8"
ureq = "3"
# sola-mail protocol stack (lifted from apocrypha/apps/mail)
imap = { version = "2", default-features = false }
rustls-connector = { version = "0.21", features = ["native-certs"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }
mail-parser = "0.9"
html2text = "0.14"

# Substitute a zero-dep stub for tauri-apps/download-cef. The upstream
# crate is a build-dependency of cef-dll-sys (transitive via `cef`)
# and unconditionally pulls ureq + rustls + ring + rustls-webpki +
# bzip2 + tar into the build graph. Those crates rebuilt every time
# we alternated between subset cargo invocations because the resolver
# computes a different feature unification per invocation. The stub
# lives at `crates/download-cef-stub/` and re-implements only the API
# surface cef-dll-sys/build.rs touches; see its src/lib.rs for the
# rationale and the OUT_DIR-symlink trick that makes -lcef resolve
# against the pre-installed `cargo make install-cef` cache.
[patch.crates-io]
download-cef = { path = "crates/download-cef-stub" }
wgpu-hal = { path = "crates/wgpu-hal-patched" }

# Release builds strip DWARF debug info but keep the symbol table, so
# stack traces from /opt/sola/log still show meaningful function names
# while binaries shrink ~70%. `cargo make publish` relies on this for
# the GitHub release tarball.
[profile.release]
strip = "debuginfo"

# Bitwarden master-password KDF is PBKDF2 × ~600k. Unoptimized debug
# makes unlock multi-second; Chrome-class clients run this in optimized
# crypto. Prefer `cargo make install browser --release` for dogfood, but
# also crank package-level opt for the crypto path so plain debug installs
# are not unusable.
[profile.dev.package.bitwarden-crypto]
opt-level = 3
[profile.dev.package.bitwarden-core]
opt-level = 3
[profile.dev.package.bitwarden-fido]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.aws-lc-sys]
opt-level = 3
[profile.dev.package.aws-lc-rs]
opt-level = 3
