[workspace]
members = ["crates/*"]
# Kept out of the workspace so its iced deps don't unify wayland-sys
# features across the workspace and break sola-river's runtime
# wayland linkage (smithay-clipboard's `dlopen` default switches the
# whole graph onto dlopen, which fails on NixOS). Build it with
# `cargo build --manifest-path crates/sola-monitor-iced/Cargo.toml`.
exclude = [
    "crates/sola-monitor-iced",
    "crates/sola-browser-wpe",
    "crates/sola-browser-cef",
    "crates/wgpu-hal-patched",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
base64 = "0.22"
imap = { version = "2", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }
mail-parser = "0.9"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-connector = { version = "0.21", features = ["native-certs"] }
toml = "0.8"
ureq = "3"

# Substitute a zero-dep stub for tauri-apps/download-cef. The upstream
# crate is a build-dependency of cef-dll-sys (transitive via `cef`)
# and unconditionally pulls ureq + rustls + ring + rustls-webpki +
# bzip2 + tar into the build graph. Those crates rebuilt every time
# we alternated between subset cargo invocations because the resolver
# computes a different feature unification per invocation. The stub
# lives at `crates/download-cef-stub/` and re-implements only the API
# surface cef-dll-sys/build.rs touches; see its src/lib.rs for the
# rationale and the OUT_DIR-symlink trick that makes -lcef resolve
# against the pre-installed `cargo make install-cef` cache.
[patch.crates-io]
download-cef = { path = "crates/download-cef-stub" }

# Release builds strip DWARF debug info but keep the symbol table, so
# stack traces from /opt/sola/log still show meaningful function names
# while binaries shrink ~70%. `cargo make publish` relies on this for
# the GitHub release tarball.
[profile.release]
strip = "debuginfo"
