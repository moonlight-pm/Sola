[workspace]
members = ["crates/*"]
# `wgpu-hal-patched` is a vendored wgpu-hal 27.0.4 with
# `VK_EXT_image_drm_format_modifier` enabled; pulled in workspace-wide
# via `[patch.crates-io]` below. Excluded as a member so cargo doesn't
# try to compile it as a standalone target.
#
# Iced/wgpu/WPE feature unification across the rest of the workspace
# is OK because `.cargo/config.toml` bakes `/run/current-system/sw/lib`
# into every binary's RUNPATH, so sola-river's runtime dlopen of
# libwayland-client finds the system lib. WPEWebKit is staged at
# `/opt/sola/nix/wpewebkit/` and pulled into `environment.systemPackages`
# via configuration.nix, so sola-browser's pkg-config probes
# (wpe-webkit-2.0, wpe-platform-2.0, …) resolve system-wide.
exclude = [
    "crates/wgpu-hal-patched",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
base64 = "0.22"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde_yaml_ng = "0.10"
toml = "0.8"
ureq = "3"
# sola-mail protocol stack (lifted from apocrypha/apps/mail)
imap = { version = "2", default-features = false }
rustls-connector = { version = "0.21", features = ["native-certs"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }
mail-parser = "0.9"
html2text = "0.14"

[patch.crates-io]
wgpu-hal = { path = "crates/wgpu-hal-patched" }

# Release builds strip DWARF debug info but keep the symbol table, so
# stack traces from /opt/sola/log still show meaningful function names
# while binaries shrink ~70%. `cargo make publish` relies on this for
# the GitHub release tarball.
[profile.release]
strip = "debuginfo"
