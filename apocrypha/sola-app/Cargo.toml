[package]
name = "sola-app"
version = "0.1.0"
edition = "2024"
description = "Legacy GTK4 + WebKit6 WebView host (apocrypha — not a workspace member)"

# Reference only. See apocrypha/README.md.

[dependencies]
sola-bus = { path = "../../crates/sola-bus" }
sola-assets = { path = "../../crates/sola-assets" }
sola-core = { path = "../../crates/sola-core" }
gtk4 = "0.9"
gdk4 = "0.9"
glib = "0.20"
gio = "0.20"
webkit6 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
swc_ts_fast_strip = "48"
swc_common = "21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
