[package]
name = "sola-switcher"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sola-switcher"
path = "src/main.rs"

[dependencies]
sola-bus = { path = "../../crates/sola-bus" }
gtk4 = "0.9"
gdk4 = "0.9"
glib = "0.20"
gio = "0.20"
webkit6 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde_json = "1"
