<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: transparent;
        overflow: hidden;
        user-select: none;
    }

    #container {
        display: flex;
        gap: 8px;
        padding: 36px 44px;
        background: rgba(30, 30, 30, 0.88);
        border-radius: 10px;
    }

    #container:empty { display: none; }

    .app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 20px 24px;
        border-radius: 7px;
        cursor: default;
    }

    .app.selected {
        background: rgba(56, 120, 240, 0.85);
    }

    .icon {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: #888;
    }

    .app.selected .icon { color: white; }

    .name {
        font-size: 12px;
        color: #888;
        white-space: nowrap;
    }

    .app.selected .name { color: white; }
</style>
</head>
<body>
<div id="container"></div>
<script type="module" src="/src/app.ts"></script>
</body>
</html>
