<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: transparent;
        overflow: hidden;
        user-select: none;
    }

    #container {
        display: flex;
        gap: 8px;
        padding: 36px 44px;
        background: rgba(30, 30, 30, 0.88);
        border-radius: 10px;
    }

    #container:empty { display: none; }

    .app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 20px 24px;
        border-radius: 7px;
        cursor: default;
    }

    .app.selected {
        background: rgba(56, 120, 240, 0.85);
    }

    .icon {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: #888;
    }

    .app.selected .icon { color: white; }

    .name {
        font-size: 12px;
        color: #888;
        white-space: nowrap;
    }

    .app.selected .name { color: white; }
</style>
</head>
<body>
<div id="container"></div>
<script>
    var container = document.getElementById('container');
    var apps = [];
    var selectedIndex = 0;

    // Called from Rust: render the full app list with initial selection.
    function render(appList, selected) {
        apps = appList;
        selectedIndex = selected;

        while (container.firstChild) {
            container.removeChild(container.firstChild);
        }

        apps.forEach(function(app, i) {
            var el = document.createElement('div');
            el.className = 'app' + (i === selectedIndex ? ' selected' : '');
            el.dataset.index = String(i);

            var iconEl = document.createElement('div');
            iconEl.className = 'icon';
            iconEl.textContent = '\u2B21';
            el.appendChild(iconEl);

            var nameEl = document.createElement('div');
            nameEl.className = 'name';
            nameEl.textContent = app.name;
            el.appendChild(nameEl);

            el.addEventListener('mouseenter', function() {
                setSelection(i);
            });

            container.appendChild(el);
        });

        document.title = String(selectedIndex);
    }

    // Called from Rust: update the visual selection.
    function setSelection(index) {
        if (index < 0 || index >= apps.length) return;
        selectedIndex = index;
        var children = container.children;
        for (var i = 0; i < children.length; i++) {
            if (i === index) {
                children[i].classList.add('selected');
            } else {
                children[i].classList.remove('selected');
            }
        }
        document.title = String(index);
    }
</script>
</body>
</html>
