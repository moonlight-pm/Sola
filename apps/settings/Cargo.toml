[package]
name = "sola-settings"
version.workspace = true
edition.workspace = true

[[bin]]
name = "sola-settings"
path = "src/main.rs"

[dependencies]
sola-app = { path = "../../crates/sola-app" }
sola-bus = { path = "../../crates/sola-bus" }
sola-core = { path = "../../crates/sola-core" }
gtk4 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
