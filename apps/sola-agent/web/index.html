<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sola-agent</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #1a1a2e; --bg-surface: #16213e; --bg-hover: #1f2f50;
  --bg-active: #253a5e; --border: #2a3a5e;
  --text: #e0e0e0; --text-dim: #8899aa; --text-bright: #fff;
  --accent: #4fc3f7; --accent-dim: #2a6f8f;
  --error: #ef5350; --success: #66bb6a;
  --user-bg: #1f2f50; --tool-bg: #121a30; --input-bg: #12182e;
  --scrollbar: #2a3a5e; --font: 'SF Mono','Fira Code','Cascadia Code',monospace;
}
html,body { height:100%; background:var(--bg); color:var(--text); font:14px var(--font); overflow:hidden; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--scrollbar); border-radius:3px; }

.app { display:flex; height:100vh; }

/* Sidebar */
.sidebar { width:260px; background:var(--bg-surface); border-right:1px solid var(--border); display:flex; flex-direction:column; }
.sidebar-header { padding:12px; border-bottom:1px solid var(--border); }
.sidebar-header button { width:100%; padding:6px; background:var(--accent-dim); color:var(--text-bright); border:none; border-radius:4px; cursor:pointer; font:12px var(--font); }
.sidebar-header button:hover { background:var(--accent); color:#000; }
.search-box { display:block; width:calc(100% - 24px); margin:8px 12px; padding:6px 10px; background:var(--input-bg); border:1px solid var(--border); border-radius:4px; color:var(--text); font:12px var(--font); outline:none; }
.search-box:focus { border-color:var(--accent); }
.convo-list { flex:1; overflow-y:auto; padding:4px 0; }
.group-label { padding:8px 12px 4px; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; }
.convo-item { padding:8px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; }
.convo-item:hover { background:var(--bg-hover); }
.convo-item.active { background:var(--bg-active); }
.dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.dot.running { background:var(--success); }
.dot.idle { background:var(--accent); }
.dot.error { background:var(--error); }
.convo-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.convo-name-input { flex:1; background:var(--input-bg); border:1px solid var(--accent); border-radius:2px; color:var(--text); font:13px var(--font); padding:1px 4px; outline:none; }

/* Main area */
.main { flex:1; display:flex; flex-direction:column; min-width:0; }
.empty-state { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:16px; }

/* Messages */
.messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg { padding:12px 16px; border-radius:8px; line-height:1.5; word-wrap:break-word; white-space:pre-wrap; }
.msg.user { background:var(--user-bg); border-left:3px solid var(--accent); }
.msg.assistant { background:var(--bg-surface); }
.msg.error-msg { color:var(--error); background:var(--bg-surface); }

/* Tool calls */
.tool-call { background:var(--tool-bg); border:1px solid var(--border); border-radius:6px; margin-top:8px; overflow:hidden; }
.tool-hdr { padding:8px 12px; display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px; color:var(--text-dim); }
.tool-hdr:hover { background:var(--bg-hover); }
.tool-hdr .tname { color:var(--accent); font-weight:600; }
.tool-hdr .arrow { transition:transform .15s; }
.tool-hdr .arrow.open { transform:rotate(90deg); }
.tool-body { display:none; padding:8px 12px; border-top:1px solid var(--border); font-size:12px; max-height:300px; overflow-y:auto; }
.tool-body.open { display:block; }
.tool-body pre { white-space:pre-wrap; word-break:break-all; color:var(--text-dim); }
.tool-body .terr { color:var(--error); }

.cursor { display:inline-block; width:8px; height:16px; background:var(--accent); animation:blink .8s infinite; vertical-align:text-bottom; }
@keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

/* Input */
.input-area { padding:12px 16px; border-top:1px solid var(--border); background:var(--bg-surface); display:flex; gap:8px; align-items:flex-end; }
.input-area textarea { flex:1; background:var(--input-bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font:14px var(--font); padding:10px 12px; resize:none; min-height:42px; max-height:200px; outline:none; line-height:1.4; }
.input-area textarea:focus { border-color:var(--accent); }
.input-area button { padding:10px 16px; background:var(--accent-dim); color:var(--text-bright); border:none; border-radius:6px; cursor:pointer; font:13px var(--font); }
.input-area button:hover { background:var(--accent); color:#000; }
.input-area button.cancel-btn { background:var(--error); }

/* Dialog */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:100; }
.dialog { background:var(--bg-surface); border:1px solid var(--border); border-radius:8px; padding:20px; width:420px; }
.dialog h3 { margin-bottom:12px; color:var(--text-bright); }
.dialog input { width:100%; padding:8px 12px; background:var(--input-bg); border:1px solid var(--border); border-radius:4px; color:var(--text); font:14px var(--font); outline:none; margin-bottom:12px; }
.dialog input:focus { border-color:var(--accent); }
.dialog-btns { display:flex; justify-content:flex-end; gap:8px; }
.dialog-btns button { padding:6px 16px; border:none; border-radius:4px; cursor:pointer; font:13px var(--font); }
.dbtn-cancel { background:var(--border); color:var(--text); }
.dbtn-create { background:var(--accent-dim); color:var(--text-bright); }
.dbtn-create:hover { background:var(--accent); color:#000; }
</style>
</head>
<body>
<div id="app" class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <button id="btn-new">+ New</button>
    </div>
    <input class="search-box" id="search" type="text" placeholder="Search...">
    <div class="convo-list" id="convo-list"></div>
  </div>
  <div class="main" id="main-area">
    <div class="empty-state" id="empty">Create or select a conversation</div>
  </div>
</div>
<script>
'use strict';

// ── State ────────────────────────────────────────────────────────────────────
const sessions = [];      // {id, name, status, firstPrompt}
const messages = {};      // sessionId -> [{role, content, streaming, tools:[]}]
let activeId = null;
let editingId = null;
let msgIdCounter = 0;

// ── Bridge ───────────────────────────────────────────────────────────────────
function send(cmd) {
  cmd._id = ++msgIdCounter;
  document.title = JSON.stringify(cmd);
}

window.sola = {
  dispatch(jsonStr) {
    try {
      const ev = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
      handleEvent(ev);
    } catch (e) { console.error('event parse error', e); }
  }
};

function handleEvent(ev) {
  switch (ev.type) {
    case 'session_state': {
      let s = sessions.find(x => x.id === ev.session_id);
      if (!s) {
        s = { id: ev.session_id, name: null, status: ev.status, firstPrompt: null };
        sessions.push(s);
        messages[ev.session_id] = [];
        if (!activeId) { activeId = ev.session_id; }
      } else {
        s.status = ev.status;
      }
      renderSidebar();
      renderMain();
      break;
    }
    case 'message_start': {
      const m = messages[ev.session_id];
      if (m) { m.push({ role: 'assistant', content: '', streaming: true, tools: [] }); renderMain(); }
      break;
    }
    case 'message_delta': {
      const m = messages[ev.session_id];
      if (!m) break;
      const last = m[m.length - 1];
      if (last && last.role === 'assistant') { last.content += ev.text; renderMain(); }
      break;
    }
    case 'message_end': {
      const m = messages[ev.session_id];
      if (!m) break;
      const last = m[m.length - 1];
      if (last) { last.streaming = false; renderMain(); }
      break;
    }
    case 'tool_start': {
      const m = messages[ev.session_id];
      if (!m) break;
      const last = m[m.length - 1];
      if (last && last.role === 'assistant') {
        last.tools.push({ name: ev.tool_name, input: ev.tool_input, output: null, isError: false, expanded: false });
        renderMain();
      }
      break;
    }
    case 'tool_end': {
      const m = messages[ev.session_id];
      if (!m) break;
      const last = m[m.length - 1];
      if (last) {
        const t = last.tools.find(t => t.name === ev.tool_name && t.output === null);
        if (t) { t.output = ev.result; t.isError = ev.is_error; renderMain(); }
      }
      break;
    }
    case 'error': {
      const sid = ev.session_id || activeId;
      if (sid) {
        if (!messages[sid]) messages[sid] = [];
        messages[sid].push({ role: 'error', content: ev.message, tools: [] });
        renderMain();
      }
      break;
    }
  }
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '...' : (s || ''); }
function isRunning() { const s = sessions.find(x => x.id === activeId); return s && s.status === 'running'; }

function scrollToBottom() {
  requestAnimationFrame(() => {
    const el = document.getElementById('msg-log');
    if (el) {
      const near = el.scrollHeight - el.scrollTop - el.clientHeight < 100;
      if (near) el.scrollTop = el.scrollHeight;
    }
  });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ── Render Sidebar ───────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('convo-list');
  const query = (document.getElementById('search').value || '').toLowerCase();
  list.textContent = '';

  const filtered = sessions.filter(s => {
    if (!query) return true;
    return (s.name || '').toLowerCase().includes(query) ||
           (s.firstPrompt || '').toLowerCase().includes(query);
  });

  const running = filtered.filter(s => s.status === 'running');
  const other = filtered.filter(s => s.status !== 'running');

  function addGroup(label, items) {
    if (!items.length) return;
    list.appendChild(el('div', 'group-label', label));
    for (const s of items) {
      const item = el('div', 'convo-item' + (s.id === activeId ? ' active' : ''));
      item.addEventListener('click', () => { activeId = s.id; renderSidebar(); renderMain(); });
      item.addEventListener('dblclick', () => startRename(s.id));

      const dot = el('span', 'dot ' + s.status);
      item.appendChild(dot);

      if (editingId === s.id) {
        const inp = document.createElement('input');
        inp.className = 'convo-name-input';
        inp.value = s.name || truncate(s.firstPrompt, 30) || 'New session';
        inp.addEventListener('blur', (e) => finishRename(s.id, e.target.value));
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') finishRename(s.id, e.target.value);
          if (e.key === 'Escape') { editingId = null; renderSidebar(); }
        });
        item.appendChild(inp);
        requestAnimationFrame(() => { inp.focus(); inp.select(); });
      } else {
        item.appendChild(el('span', 'convo-name', s.name || truncate(s.firstPrompt, 30) || 'New session'));
      }
      list.appendChild(item);
    }
  }

  addGroup('Running', running);
  addGroup('Sessions', other);
}

function startRename(id) { editingId = id; renderSidebar(); }

function finishRename(id, name) {
  editingId = null;
  if (name.trim()) {
    const s = sessions.find(x => x.id === id);
    if (s) s.name = name.trim();
    send({ type: 'rename_conversation', session_id: id, name: name.trim() });
  }
  renderSidebar();
}

// ── Render Main ──────────────────────────────────────────────────────────────
function renderMain() {
  const area = document.getElementById('main-area');
  area.textContent = '';

  if (!activeId || !messages[activeId]) {
    area.appendChild(el('div', 'empty-state', 'Create or select a conversation'));
    return;
  }

  // Message log
  const log = el('div', 'messages');
  log.id = 'msg-log';
  const msgs = messages[activeId] || [];

  for (const msg of msgs) {
    if (msg.role === 'user') {
      log.appendChild(el('div', 'msg user', msg.content));
    } else if (msg.role === 'error') {
      log.appendChild(el('div', 'msg error-msg', msg.content));
    } else {
      // Assistant message
      const div = el('div', 'msg assistant');
      div.appendChild(document.createTextNode(msg.content));
      if (msg.streaming) {
        div.appendChild(el('span', 'cursor'));
      }
      // Tool calls
      for (let ti = 0; ti < msg.tools.length; ti++) {
        const tool = msg.tools[ti];
        const tc = el('div', 'tool-call');

        const hdr = el('div', 'tool-hdr');
        const arrow = el('span', 'arrow' + (tool.expanded ? ' open' : ''), '\u25B6');
        hdr.appendChild(arrow);
        hdr.appendChild(el('span', 'tname', tool.name));
        hdr.appendChild(el('span', null, tool.output === null ? 'running...' : (tool.isError ? 'error' : 'done')));
        hdr.addEventListener('click', ((t, a) => () => {
          t.expanded = !t.expanded;
          a.className = 'arrow' + (t.expanded ? ' open' : '');
          body.className = 'tool-body' + (t.expanded ? ' open' : '');
        })(tool, arrow));
        tc.appendChild(hdr);

        const body = el('div', 'tool-body' + (tool.expanded ? ' open' : ''));
        body.appendChild(el('div', null, 'Input:'));
        const inputPre = el('pre');
        inputPre.textContent = truncate(tool.input, 2000);
        body.appendChild(inputPre);
        if (tool.output !== null) {
          body.appendChild(el('div', null, 'Output:'));
          const outPre = el('pre', tool.isError ? 'terr' : '');
          outPre.textContent = truncate(tool.output, 2000);
          body.appendChild(outPre);
        }
        tc.appendChild(body);
        div.appendChild(tc);
      }
      log.appendChild(div);
    }
  }
  area.appendChild(log);

  // Input area
  const inputArea = el('div', 'input-area');
  const textarea = document.createElement('textarea');
  textarea.id = 'msg-input';
  textarea.rows = 1;
  textarea.placeholder = isRunning() ? 'Agent is working...' : 'Send a message...';
  if (isRunning()) textarea.disabled = true;
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  textarea.addEventListener('input', (e) => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 200) + 'px';
  });
  inputArea.appendChild(textarea);

  if (isRunning()) {
    const btn = el('button', 'cancel-btn', 'Cancel');
    btn.addEventListener('click', () => send({ type: 'cancel', session_id: activeId }));
    inputArea.appendChild(btn);
  } else {
    const btn = el('button', null, 'Send');
    btn.addEventListener('click', sendMessage);
    inputArea.appendChild(btn);
  }
  area.appendChild(inputArea);

  scrollToBottom();
}

// ── Actions ──────────────────────────────────────────────────────────────────
function sendMessage() {
  const ta = document.getElementById('msg-input');
  if (!ta) return;
  const text = ta.value.trim();
  if (!text || !activeId || isRunning()) return;

  if (!messages[activeId]) messages[activeId] = [];
  messages[activeId].push({ role: 'user', content: text, tools: [] });

  const s = sessions.find(x => x.id === activeId);
  if (s && !s.firstPrompt) s.firstPrompt = text;

  send({ type: 'send_message', session_id: activeId, text: text });
  ta.value = '';
  ta.style.height = 'auto';
  renderSidebar();
  renderMain();
}

function showNewDialog() {
  const existing = document.querySelector('.overlay');
  if (existing) existing.remove();

  const overlay = el('div', 'overlay');
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  const dialog = el('div', 'dialog');
  dialog.appendChild(el('h3', null, 'New Session'));

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = '/path/to/project';
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { createSession(input.value); overlay.remove(); }
    if (e.key === 'Escape') overlay.remove();
  });
  dialog.appendChild(input);

  const btns = el('div', 'dialog-btns');
  const cancelBtn = el('button', 'dbtn-cancel', 'Cancel');
  cancelBtn.addEventListener('click', () => overlay.remove());
  btns.appendChild(cancelBtn);
  const createBtn = el('button', 'dbtn-create', 'Create');
  createBtn.addEventListener('click', () => { createSession(input.value); overlay.remove(); });
  btns.appendChild(createBtn);
  dialog.appendChild(btns);

  overlay.appendChild(dialog);
  document.body.appendChild(overlay);
  requestAnimationFrame(() => input.focus());
}

function createSession(dir) {
  if (!dir.trim()) return;
  send({ type: 'new_session', working_dir: dir.trim() });
}

// ── Init ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-new').addEventListener('click', showNewDialog);
document.getElementById('search').addEventListener('input', renderSidebar);
renderMain();
</script>
</body>
</html>
