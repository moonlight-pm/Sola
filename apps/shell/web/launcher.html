<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 100vw;
        height: 100vh;
        background: rgba(30, 30, 30, 0.92);
        border-radius: 10px;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: system-ui, -apple-system, sans-serif;
        color: #eee;
        display: flex;
        flex-direction: column;
    }

    #query {
        flex: 0 0 auto;
        padding: 18px 22px;
        font-size: 20px;
        background: transparent;
        color: #fff;
        border: none;
        outline: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    #results {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 6px 0;
    }

    .row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 22px;
        height: 52px;
        font-size: 15px;
        cursor: default;
    }

    .row.selected {
        background: rgba(56, 120, 240, 0.85);
    }

    .row .icon {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #aaa;
    }

    .row.selected .icon { color: #fff; }

    .row .icon img {
        width: 28px;
        height: 28px;
    }

    .row .label {
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    #empty {
        padding: 18px 22px;
        color: #888;
        font-size: 14px;
    }
</style>
</head>
<body>
<input id="query" type="text" autocomplete="off" spellcheck="false" />
<div id="results"></div>
<script type="module" src="/src/launcher.ts"></script>
</body>
</html>
