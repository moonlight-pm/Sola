<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: system-ui, -apple-system, sans-serif;
    }

    #menu {
        position: absolute;
        display: none;
        min-width: 180px;
        background: rgba(40, 42, 48, 0.96);
        border-radius: 6px;
        padding: 4px 0;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    #menu.active { display: inline-block; }

    .menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 16px;
        font-size: 13px;
        color: #ccc;
        cursor: default;
        white-space: nowrap;
    }

    .menu-item:hover { background: rgba(56, 120, 240, 0.7); color: white; }
    .menu-item.disabled { color: #666; pointer-events: none; }
    .menu-item .shortcut { color: #888; font-size: 11px; margin-left: 24px; }
    .menu-item:hover .shortcut { color: rgba(255,255,255,0.7); }

    .menu-divider {
        height: 1px;
        background: rgba(255,255,255,0.1);
        margin: 4px 8px;
    }
</style>
</head>
<body>
<div id="menu"></div>
<script>
var menuEl = document.getElementById('menu');

document.addEventListener('click', function(e) {
    if (!menuEl.contains(e.target)) {
        document.title = 'dismiss';
    }
});

function showMenu(items, anchorX) {
    while (menuEl.firstChild) menuEl.removeChild(menuEl.firstChild);
    menuEl.style.left = (anchorX || 0) + 'px';
    menuEl.style.top = '0px';
    menuEl.className = 'active';

    items.forEach(function(item) {
        if (item.type === 'divider') {
            var div = document.createElement('div');
            div.className = 'menu-divider';
            menuEl.appendChild(div);
            return;
        }

        var el = document.createElement('div');
        el.className = 'menu-item' + (item.disabled ? ' disabled' : '');

        var label = document.createElement('span');
        label.textContent = item.label;
        el.appendChild(label);

        if (item.shortcut) {
            var sc = document.createElement('span');
            sc.className = 'shortcut';
            sc.textContent = formatShortcut(item.shortcut);
            el.appendChild(sc);
        }

        if (!item.disabled) {
            el.addEventListener('click', function() {
                document.title = 'action:' + item.app_id + ':' + item.id;
            });
        }

        menuEl.appendChild(el);
    });
}

function clearMenu() {
    menuEl.className = '';
    while (menuEl.firstChild) menuEl.removeChild(menuEl.firstChild);
}

function formatShortcut(s) {
    return s
        .replace(/Super\+Shift\+/g, '\u21E7\u2318')
        .replace(/Super\+/g, '\u2318')
        .replace(/Shift\+/g, '\u21E7')
        .replace('Backspace', '\u232B');
}
</script>
</body>
</html>
