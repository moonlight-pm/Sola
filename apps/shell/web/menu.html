<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: system-ui, -apple-system, sans-serif;
    }

    #menu {
        position: absolute;
        display: none;
        min-width: 180px;
        background: rgba(40, 42, 48, 0.96);
        border-radius: 0 0 6px 6px;
        padding: 4px 0;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    #menu.active { display: inline-block; }

    .menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 16px;
        font-size: 13px;
        color: #ccc;
        cursor: default;
        white-space: nowrap;
    }

    .menu-item:hover { background: rgba(56, 120, 240, 0.7); color: white; }
    .menu-item.disabled { color: #666; pointer-events: none; }
    .menu-item .shortcut { color: #888; font-size: 11px; margin-left: 24px; }
    .menu-item:hover .shortcut { color: rgba(255,255,255,0.7); }

    .menu-divider {
        height: 1px;
        background: rgba(255,255,255,0.1);
        margin: 4px 8px;
    }
</style>
</head>
<body>
<div id="menu"></div>
<script type="module" src="/src/menu.ts"></script>
</body>
</html>
