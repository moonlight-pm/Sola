<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 100vw;
        height: 28px;
        display: flex;
        align-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        background: rgba(20, 22, 28, 0.95);
        color: #ccc;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
    }

    #left {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
    }

    #menu-labels {
        display: flex;
        align-items: center;
    }

    #right {
        display: flex;
        align-items: center;
        padding-right: 16px;
    }

    .menu-label {
        padding: 0 12px;
        height: 28px;
        display: flex;
        align-items: center;
        cursor: default;
        white-space: nowrap;
    }

    .menu-label.active, #system-menu.active {
        background: rgba(40, 42, 48, 0.96);
    }

    #system-menu {
        padding: 0 12px;
        height: 28px;
        display: flex;
        align-items: center;
        cursor: default;
    }

    #system-menu svg {
        width: 16px;
        height: 16px;
    }

    .menu-label.app-name {
        font-weight: 600;
        color: #fff;
    }

    #clock {
        color: #999;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
    }

    #toast {
        position: absolute;
        left: 50%;
        top: 0;
        height: 28px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        padding: 0 14px;
        max-width: 60vw;
        font-size: 12px;
        color: #eee;
        background: rgba(56, 40, 40, 0.92);
        border-radius: 0 0 6px 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
    }

    #toast.visible {
        opacity: 1;
    }
</style>
</head>
<body>
<div id="left">
    <div id="system-menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a7 7 0 1 0 10 10"/></svg>
    </div>
    <div id="app-name" class="menu-label app-name"></div>
    <div id="menu-labels"></div>
</div>
<div id="right">
    <div id="clock"></div>
</div>
<div id="toast"></div>
<script type="module" src="/src/menubar.ts"></script>
</body>
</html>
