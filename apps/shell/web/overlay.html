<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 100vw;
        height: 100vh;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: system-ui, -apple-system, sans-serif;
    }

    /* --- App Switcher --- */
    #switcher {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    #switcher.active {
        display: flex;
        gap: 8px;
        padding: 36px 44px;
        background: rgba(30, 30, 30, 0.88);
        border-radius: 10px;
    }

    .app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 20px 24px;
        border-radius: 7px;
        cursor: default;
    }

    .app.selected {
        background: rgba(56, 120, 240, 0.85);
    }

    .icon {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: #888;
    }

    .app.selected .icon { color: white; }

    .name {
        font-size: 12px;
        color: #888;
        white-space: nowrap;
    }

    .app.selected .name { color: white; }

    /* --- Dropdown Menu --- */
    #dropdown {
        display: none;
        position: absolute;
        top: 28px;
        min-width: 200px;
        background: rgba(40, 42, 48, 0.96);
        border-radius: 6px;
        padding: 4px 0;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    #dropdown.active { display: block; }

    .menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 16px;
        font-size: 13px;
        color: #ccc;
        cursor: default;
    }

    .menu-item:hover { background: rgba(56, 120, 240, 0.7); color: white; }
    .menu-item.disabled { color: #666; pointer-events: none; }
    .menu-item .shortcut { color: #888; font-size: 11px; margin-left: 24px; }
    .menu-item:hover .shortcut { color: rgba(255,255,255,0.7); }

    .menu-divider {
        height: 1px;
        background: rgba(255,255,255,0.1);
        margin: 4px 8px;
    }
</style>
</head>
<body>
<div id="switcher"></div>
<div id="dropdown"></div>
<script>
__OVERLAY_JS__
</script>
</body>
</html>
