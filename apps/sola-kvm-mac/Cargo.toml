# Standalone package: empty workspace table so we are NOT a member of the
# parent Sola workspace (Phase B owns only apps/sola-kvm-mac/**).
[workspace]

[package]
name = "sola-kvm-mac"
version = "0.1.0"
edition = "2021"
description = "ember (macOS) UDP receive + CGEvent inject agent for sola-kvm"
license = "MIT"
publish = false

[[bin]]
name = "sola-kvm-mac"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Paired traffic: `link.rs` (Noise IK), shared with sola-kvm.
snow = "0.10"
getrandom = "0.2"

# CoreGraphics / CoreFoundation are linked only on macOS (see inject.rs).
# This package is intentionally standalone (not a Sola workspace member) so
# it can be built on ember without pulling the full desktop tree.

# Remote view: the screen (ScreenCaptureKit) and its encoder (VideoToolbox).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
objc2-screen-capture-kit = "0.3"
# The pointer, drawn by the viewer: NSCursor's image.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSCursor",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "objc2-core-graphics",
] }
