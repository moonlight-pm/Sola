[package]
name = "sola-agent"
version.workspace = true
edition.workspace = true

[dependencies]
# Sola framework
sola-app = { path = "../../crates/sola-app" }
sola-bus = { path = "../../crates/sola-bus" }

# Claurst agent engine
claurst-core = { git = "https://github.com/Kuberwastaken/claurst" }
claurst-api = { git = "https://github.com/Kuberwastaken/claurst" }
claurst-query = { git = "https://github.com/Kuberwastaken/claurst" }
claurst-tools = { git = "https://github.com/Kuberwastaken/claurst" }
claurst-mcp = { git = "https://github.com/Kuberwastaken/claurst" }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP (token refresh)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"

# Other
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
async-trait = "0.1"
parking_lot = "0.12"
