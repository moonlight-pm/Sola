[package]
name = "sola-agent"
version.workspace = true
edition.workspace = true

[dependencies]
# Sola framework
sola-app = { path = "../../crates/sola-app" }
sola-bus = { path = "../../crates/sola-bus" }
sola-core = { path = "../../crates/sola-core" }
gtk4 = "0.9"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Other
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
async-trait = "0.1"
